<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Terrarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.72), transparent 16%),
                radial-gradient(circle at 75% 18%, rgba(216, 238, 212, 0.38), transparent 20%),
                linear-gradient(180deg, #dfeccd 0%, #c9d9ba 22%, #b4c9a5 52%, #8ea37f 100%);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(transparent 0%, rgba(50, 72, 48, 0.12) 100%),
                radial-gradient(circle at 15% 65%, rgba(116, 169, 111, 0.14), transparent 18%),
                radial-gradient(circle at 80% 55%, rgba(69, 98, 79, 0.14), transparent 18%);
            pointer-events: none;
            z-index: 10;
        }
        canvas { display: block; width: 100vw; height: 100vh; filter: saturate(1.16) contrast(1.06) brightness(0.98); }
        .weather-controls {
            position: fixed; top: 26px; right: 26px; display: flex; gap: 12px; padding: 9px 11px;
            background: rgba(135, 151, 123, 0.28); border: 2px solid rgba(72, 89, 63, 0.2); border-radius: 999px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 7px 16px rgba(56, 72, 51, 0.14); z-index: 100;
        }
        .weather-btn {
            padding: 11px 20px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em;
            border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px; cursor: pointer;
            background: linear-gradient(180deg, rgba(244,245,238,0.72), rgba(214,220,207,0.7)); color: #40503c;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18);
        }
        .weather-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(75, 68, 61, 0.14); }
        .weather-btn.active {
            background: linear-gradient(135deg, #6f9b63 0%, #5a8555 44%, #466c47 100%); color: #f7f3ea;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(63, 95, 63, 0.28);
        }
        .rain-control {
            position: fixed; top: 100px; right: 26px; display: flex; align-items: center; gap: 10px;
            min-width: 248px; padding: 10px 13px; border: 2px solid rgba(72, 89, 63, 0.2); border-radius: 16px;
            background: rgba(135, 151, 123, 0.3); color: #40503c; font-size: 12px; font-weight: 800;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 7px 16px rgba(56, 72, 51, 0.14); z-index: 100;
        }
        .rain-control[hidden] { display: none; }
        .rain-control input { flex: 1; min-width: 80px; accent-color: #5a8555; cursor: pointer; }
        .rain-control output { min-width: 3ch; text-align: right; }
        @media (max-width: 560px) {
            .rain-control { top: 98px; right: 16px; min-width: 0; width: 238px; }
        }
        .audio-toggle {
            position: fixed; top: 26px; left: 26px; padding: 11px 20px; font-size: 13px; font-weight: 800;
            letter-spacing: 0.04em; border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px; cursor: pointer;
            background: linear-gradient(180deg, rgba(244,245,238,0.72), rgba(214,220,207,0.7)); color: #40503c;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18); z-index: 100;
        }
        .audio-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(75, 68, 61, 0.14); }
        .audio-toggle.on {
            background: linear-gradient(135deg, #a5cd7a 0%, #7ea75d 40%, #5f7f4d 100%); color: #f7f3ea;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(63, 95, 63, 0.28);
        }
        .light-toggle {
            position: fixed; top: 84px; left: 26px; display: flex; align-items: center; gap: 9px; padding: 11px 16px;
            border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px;
            background: linear-gradient(180deg, rgba(244,245,238,0.82), rgba(214,220,207,0.8));
            color: #40503c; font-size: 13px; font-weight: 800;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 7px 16px rgba(56, 72, 51, 0.14); cursor: pointer; z-index: 100;
        }
        .light-toggle input { width: 15px; height: 15px; margin: 0; accent-color: #5a8555; cursor: pointer; }
        .hint {
            position: fixed; left: 26px; bottom: 22px; max-width: 360px; padding: 10px 14px; border-radius: 14px;
            background: rgba(135, 151, 123, 0.3); border: 2px solid rgba(72, 89, 63, 0.2); color: #40503c;
            font-size: 12px; font-weight: 700; line-height: 1.45; z-index: 100; pointer-events: none;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .loader-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 22px; background: linear-gradient(180deg, #dfeccd 0%, #c9d9ba 40%, #b4c9a5 100%);
            z-index: 1000; opacity: 1; transition: opacity 0.8s ease;
        }
        .loader-overlay.loader-hidden { opacity: 0; pointer-events: none; }
        .loader-spinner {
            width: 58px; height: 58px; border-radius: 50%; border: 5px solid rgba(90, 133, 85, 0.25);
            border-top-color: #5a8555; animation: loader-spin 0.9s linear infinite;
        }
        .loader-label { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #40503c; text-transform: uppercase; }
        @keyframes loader-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
        <div class="loader-label">Growing your world…</div>
    </div>
    <button class="audio-toggle" id="audioToggle">Audio Off</button>
    <label class="light-toggle" for="lightShaftToggle">
        <input id="lightShaftToggle" type="checkbox" checked>
        <span>Sunbeams</span>
    </label>
    <div class="weather-controls">
        <button class="weather-btn active" data-weather="sunny">Sunny</button>
        <button class="weather-btn" data-weather="rainy">Rainy</button>
        <button class="weather-btn" data-weather="night">Night</button>
    </div>
    <div class="rain-control" id="rainControl" hidden>
        <label for="rainAmount">Rain</label>
        <input id="rainAmount" type="range" min="0" max="100" value="55" step="1" aria-label="Rain amount">
        <output id="rainAmountValue" for="rainAmount">55%</output>
    </div>
    <div class="hint">Double-click the ground to drop in &middot; WASD / arrows to walk &middot; Shift to run &middot; Esc to leave</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- Loading manager + spinner overlay ----------------------------------
        const loadingManager = new THREE.LoadingManager();
        const loaderOverlay = document.getElementById('loaderOverlay');
        let loaderHidden = false;
        function hideLoader() {
            if (loaderHidden) return;
            loaderHidden = true;
            if (!loaderOverlay) return;
            loaderOverlay.classList.add('loader-hidden');
            loaderOverlay.addEventListener('transitionend', () => loaderOverlay.remove(), { once: true });
        }
        loadingManager.onLoad = hideLoader;
        loadingManager.onError = (url) => {
            console.warn('Asset failed to load:', url);
            hideLoader();
        };
        window.setTimeout(hideLoader, 8000);
        const gltfLoader = new GLTFLoader(loadingManager);
        const modelCache = new Map();

        function loadModelTemplate(fileName) {
            if (!modelCache.has(fileName)) {
                const modelUrl = new URL(`assets/${fileName}`, import.meta.url).href;
                modelCache.set(fileName, new Promise((resolve, reject) => {
                    gltfLoader.load(modelUrl, resolve, undefined, reject);
                }));
            }
            return modelCache.get(fileName);
        }

        function cloneFittedModel(gltf, targetSize, useSourceScene = false) {
            const sourceModel = useSourceScene ? gltf.scene : cloneSkeleton(gltf.scene);
            const sourceBounds = new THREE.Box3().setFromObject(sourceModel);
            const sourceSize = sourceBounds.getSize(new THREE.Vector3());
            const largestDimension = Math.max(sourceSize.x, sourceSize.y, sourceSize.z);
            if (largestDimension > 0) sourceModel.scale.multiplyScalar(targetSize / largestDimension);
            sourceModel.updateMatrixWorld(true);

            const fittedBounds = new THREE.Box3().setFromObject(sourceModel);
            const fittedCenter = fittedBounds.getCenter(new THREE.Vector3());
            sourceModel.position.set(-fittedCenter.x, -fittedBounds.min.y, -fittedCenter.z);
            const model = new THREE.Group();
            model.add(sourceModel);
            model.traverse((object) => {
                if (object.isMesh) {
                    object.castShadow = true;
                    object.receiveShadow = true;
                    // Only skinned meshes need culling disabled; static ones can be culled (big world).
                    if (object.isSkinnedMesh) object.frustumCulled = false;
                }
            });
            return model;
        }

        function replaceWithModel(fallback, fileName, targetHeight, position, onLoaded, useSourceScene = false) {
            loadModelTemplate(fileName).then((gltf) => {
                const model = cloneFittedModel(gltf, targetHeight, useSourceScene);
                model.position.add(position);
                scene.add(model);
                scene.remove(fallback);
                fallback.traverse((object) => {
                    if (object.isMesh && object.geometry) object.geometry.dispose();
                });
                if (onLoaded) onLoaded(model, gltf);
            }).catch((error) => {
                console.warn(`Could not load ${fileName}; keeping procedural fallback.`, error);
            });
        }

        async function loadModel(url, position = new THREE.Vector3(0, 0, 0), scale = 1) {
            const gltf = await gltfLoader.loadAsync(url);
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            if (typeof scale === 'number') model.scale.setScalar(scale);
            else model.scale.copy(scale);
            model.position.copy(position);
            scene.add(model);
            return model;
        }

        // --- World size (10x per side vs. the original terrarium) -------------------
        const SOIL_SIZE = 528;                  // was 52.8
        const SOIL_SCALE = SOIL_SIZE / 17.6;
        const SOIL_HALF = SOIL_SIZE / 2;
        const GLASS_W = 600, GLASS_H = 380;     // was 60 x 38
        const soilSurfaceY = 3.84;              // base ground level
        const WATER_Y = soilSurfaceY - 0.55;    // river / stream surface
        const EYE_HEIGHT = 2.05;
        const RAIN_BOX_WALK = 90;
        const RAIN_BOX_OVERVIEW = 540;
        let frameCount = 0;

        const clamp = THREE.MathUtils.clamp;
        const rnd = (a, b) => a + Math.random() * (b - a);
        const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = null;
        scene.fog = new THREE.FogExp2(0xcfe2c7, 0.0);

        // Camera setup
        const OVERVIEW_NEAR = 1, OVERVIEW_FAR = 4000, WALK_NEAR = 0.05, WALK_FAR = 1800;
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, OVERVIEW_NEAR, OVERVIEW_FAR);
        camera.position.set(480, 400, 540);
        const overviewFov = camera.fov;
        let targetFov = overviewFov;
        let walkingDistance = 0;
        let headBob = 0;
        let eyeSmooth = 0;
        const focusTarget = new THREE.Vector3(0, 4, 0);

        const backdropThemes = {
            sunny: {
                sky: new THREE.Color(0x9fc8d8),
                horizon: new THREE.Color(0xe8b99b),
                glow: new THREE.Color(0xffdda9),
                glowPosition: new THREE.Vector2(0.72, 0.58),
            },
            rainy: {
                sky: new THREE.Color(0x536e78),
                horizon: new THREE.Color(0x91a49a),
                glow: new THREE.Color(0xbfc9bd),
                glowPosition: new THREE.Vector2(0.7, 0.5),
            },
            night: {
                sky: new THREE.Color(0x151a32),
                horizon: new THREE.Color(0x44516f),
                glow: new THREE.Color(0xe4d8b4),
                glowPosition: new THREE.Vector2(0.76, 0.72),
            },
        };
        const backdropTarget = {
            sky: backdropThemes.sunny.sky.clone(),
            horizon: backdropThemes.sunny.horizon.clone(),
            glow: backdropThemes.sunny.glow.clone(),
            glowPosition: backdropThemes.sunny.glowPosition.clone(),
        };
        const backdropUniforms = {
            uSkyColor: { value: backdropThemes.sunny.sky.clone() },
            uHorizonColor: { value: backdropThemes.sunny.horizon.clone() },
            uGlowColor: { value: backdropThemes.sunny.glow.clone() },
            uGlowPosition: { value: backdropThemes.sunny.glowPosition.clone() },
        };
        const backdropMaterial = new THREE.ShaderMaterial({
            uniforms: backdropUniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uSkyColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uGlowColor;
                uniform vec2 uGlowPosition;
                varying vec2 vUv;
                void main() {
                    float height = smoothstep(0.0, 1.0, vUv.y);
                    vec3 color = mix(uHorizonColor, uSkyColor, height);
                    vec2 glowOffset = (vUv - uGlowPosition) * vec2(1.0, 1.2);
                    float radialGlow = exp(-dot(glowOffset, glowOffset) * 20.0);
                    color = mix(color, uGlowColor, radialGlow * 0.78);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            depthTest: false,
            depthWrite: false,
            toneMapped: false,
        });
        const backdropDistance = 112;
        const backdropPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backdropMaterial);
        backdropPlane.position.set(0, 0, -backdropDistance);
        backdropPlane.renderOrder = -1000;
        backdropPlane.frustumCulled = false;

        function resizeBackdrop() {
            const height = 2 * backdropDistance * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
            backdropPlane.scale.set(height * camera.aspect, height, 1);
        }

        resizeBackdrop();
        camera.add(backdropPlane);
        scene.add(camera);

        function setBackdropTheme(weather) {
            const theme = backdropThemes[weather];
            backdropTarget.sky.copy(theme.sky);
            backdropTarget.horizon.copy(theme.horizon);
            backdropTarget.glow.copy(theme.glow);
            backdropTarget.glowPosition.copy(theme.glowPosition);
        }

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bokehPass = new BokehPass(scene, camera, {
            focus: camera.position.distanceTo(focusTarget),
            aperture: 0.0001,
            maxblur: 0.0005,
        });
        composer.addPass(bokehPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.8, 0.75);
        bloomPass.threshold = 0.75;
        bloomPass.strength = 0.45;
        bloomPass.radius = 0.55;
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 40;
        controls.maxDistance = 1900;
        controls.target.set(0, 4, 0);
        const pointerControls = new PointerLockControls(camera, renderer.domElement);
        const explorationClock = new THREE.Clock();
        const movementKeys = new Set();
        const overviewCameraPosition = new THREE.Vector3();
        const overviewOrbitTarget = new THREE.Vector3();
        const walkDirection = new THREE.Vector3();
        const walkForward = new THREE.Vector3();
        const walkRight = new THREE.Vector3();
        const fallbackLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let explorationActive = false;
        let pointerLockUnavailable = false;
        let fallbackMouseLook = false;
        let fallbackMouseX = 0;
        let fallbackMouseY = 0;
        let focusDistance = bokehPass.uniforms.focus.value;
        const focusTargetView = new THREE.Vector3();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // The sun's shadow frustum follows the player so shadows stay sharp in a huge world.
        const sunOffset = new THREE.Vector3(10, 20, 8).normalize().multiplyScalar(110);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.copy(sunOffset);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(4096, 4096);
        directionalLight.shadow.camera.left = -70;
        directionalLight.shadow.camera.right = 70;
        directionalLight.shadow.camera.top = 70;
        directionalLight.shadow.camera.bottom = -70;
        directionalLight.shadow.camera.near = 10;
        directionalLight.shadow.camera.far = 260;
        directionalLight.shadow.camera.updateProjectionMatrix();
        directionalLight.shadow.bias = -0.0003;
        directionalLight.shadow.normalBias = 0.05;
        directionalLight.shadow.radius = 3;
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const hemisphereLight = new THREE.HemisphereLight(0xdff7ff, 0x214e2a, 0.7);
        scene.add(hemisphereLight);

        const glassEdgeLight = new THREE.PointLight(0xffffff, 2.8, 60, 2);
        glassEdgeLight.position.set(6, 9, 6);
        scene.add(glassEdgeLight);

        // Terrarium Case (Glass Cube)
        const glassGeometry = new THREE.BoxGeometry(GLASS_W, GLASS_H, GLASS_W);
        const glassCanvas = document.createElement('canvas');
        glassCanvas.width = 256;
        glassCanvas.height = 256;
        const glassCtx = glassCanvas.getContext('2d');

        function generateGlassNormalMap(t) {
            const image = glassCtx.createImageData(glassCanvas.width, glassCanvas.height);
            const data = image.data;
            const wave = currentWeather === 'rainy' ? 1 : 0.35;

            for (let y = 0; y < glassCanvas.height; y++) {
                for (let x = 0; x < glassCanvas.width; x++) {
                    const idx = (y * glassCanvas.width + x) * 4;
                    const nx = (x / glassCanvas.width) * 2 - 1;
                    const ny = (y / glassCanvas.height) * 2 - 1;
                    const noise = Math.sin((x * 0.18) + t * 1.6) * Math.cos((y * 0.14) - t * 1.3);
                    const droplets = Math.exp(-((nx * nx + ny * ny) * 32)) * wave * 0.9;
                    const height = noise * 0.5 + droplets + 0.25;

                    data[idx] = Math.min(255, Math.max(0, 128 + height * 60));
                    data[idx + 1] = Math.min(255, Math.max(0, 128 + height * 60));
                    data[idx + 2] = 255;
                    data[idx + 3] = 255;
                }
            }
            glassCtx.putImageData(image, 0, 0);
        }

        const glassNormalTexture = new THREE.CanvasTexture(glassCanvas);
        glassNormalTexture.wrapS = THREE.RepeatWrapping;
        glassNormalTexture.wrapT = THREE.RepeatWrapping;
        glassNormalTexture.anisotropy = 8;

        // Simple see-through glass (transmission made the inside too dark to see)
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xeaf6f0,
            metalness: 0,
            roughness: 0.05,
            transmission: 0,
            transparent: true,
            opacity: 0.10,
            depthWrite: false,
            ior: 1.5,
            clearcoat: 1,
            clearcoatRoughness: 0.04,
            normalMap: glassNormalTexture,
            normalScale: new THREE.Vector2(0.02, 0.02),
            side: THREE.DoubleSide,
        });
        const glassCube = new THREE.Mesh(glassGeometry, glassMaterial);
        glassCube.position.y = GLASS_H / 2 - 0.4;
        glassCube.castShadow = false;
        glassCube.receiveShadow = false;
        scene.add(glassCube);

        const glassFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(glassGeometry),
            new THREE.LineBasicMaterial({ color: 0xd8eee5, transparent: true, opacity: 0.6, depthWrite: false })
        );
        glassFrame.position.copy(glassCube.position);
        glassFrame.visible = true;
        scene.add(glassFrame);

        const godRayNoiseCanvas = document.createElement('canvas');
        godRayNoiseCanvas.width = 128;
        godRayNoiseCanvas.height = 256;
        const godRayNoiseContext = godRayNoiseCanvas.getContext('2d');
        const godRayNoiseImage = godRayNoiseContext.createImageData(128, 256);
        for (let i = 0; i < godRayNoiseImage.data.length; i += 4) {
            const value = Math.floor(Math.random() * 256);
            godRayNoiseImage.data[i] = value;
            godRayNoiseImage.data[i + 1] = value;
            godRayNoiseImage.data[i + 2] = value;
            godRayNoiseImage.data[i + 3] = 255;
        }
        godRayNoiseContext.putImageData(godRayNoiseImage, 0, 0);

        const godRayNoiseTexture = new THREE.CanvasTexture(godRayNoiseCanvas);
        godRayNoiseTexture.wrapS = THREE.RepeatWrapping;
        godRayNoiseTexture.wrapT = THREE.RepeatWrapping;

        const godRayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uNoise: { value: godRayNoiseTexture },
                uTime: { value: 0 },
                uIntensity: { value: 0 },
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D uNoise;
                uniform float uTime;
                uniform float uIntensity;
                varying vec2 vUv;
                void main() {
                    vec2 noiseUv = vec2(vUv.x * 2.0 + uTime * 0.006, vUv.y * 3.0 - uTime * 0.018);

        // =====================================================================
        //  TERRAIN: noise hills + carved river and streams

        function hash2(ix, iz) {
            let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            h ^= h >>> 16;
            return (h >>> 0) / 4294967296;
        }
        function vnoise(x, z) {
            const ix = Math.floor(x), iz = Math.floor(z);
            const fx = x - ix, fz = z - iz;
            const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
            const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm2(x, z, octaves) {
            let sum = 0, amp = 0.5, freq = 1;
            for (let i = 0; i < octaves; i++) {
                sum += amp * vnoise(x * freq, z * freq);
                freq *= 2;
                amp *= 0.5;
            }
            return sum;
        }

        function buildWaterway(points, widths, depth) {
            const segs = [];
            for (let i = 0; i < points.length - 1; i++) {
                segs.push({ ax: points[i].x, az: points[i].z, bx: points[i + 1].x, bz: points[i + 1].z, wa: widths[i], wb: widths[i + 1] });
            }
            const groups = [];
            const GROUP = 6;
            for (let i = 0; i < segs.length; i += GROUP) {
                const part = segs.slice(i, i + GROUP);
                let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
                for (const s of part) {
                    minX = Math.min(minX, s.ax, s.bx); maxX = Math.max(maxX, s.ax, s.bx);
                    minZ = Math.min(minZ, s.az, s.bz); maxZ = Math.max(maxZ, s.az, s.bz);
                }
                const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
                groups.push({ cx, cz, r: Math.hypot(maxX - minX, maxZ - minZ) / 2 + 1, part });
            }
            return { groups, reach: Math.max(...widths) * 3.2, depth };
        }

        let wdD = 0, wdW = 1;
        function waterDist(ww, x, z) {
            let bestD = Infinity, bestW = 1;
            for (const g of ww.groups) {
                const gd = Math.hypot(x - g.cx, z - g.cz) - g.r;
                if (gd > Math.min(bestD, ww.reach)) continue;
                for (const s of g.part) {
                    const abx = s.bx - s.ax, abz = s.bz - s.az;
                    const t = clamp(((x - s.ax) * abx + (z - s.az) * abz) / (abx * abx + abz * abz), 0, 1);
                    const d = Math.hypot(x - (s.ax + abx * t), z - (s.az + abz * t));
                    if (d < bestD) { bestD = d; bestW = s.wa + (s.wb - s.wa) * t; }
                }
            }
            wdD = bestD;
            wdW = bestW;
        }

        function carve(h, d, w, depth) {
            if (d > w * 3.2) return h;
            const shore = WATER_Y + 0.12;
            let out;
            if (d <= w) {
                const k = d / w;
                out = shore - (depth + 0.12) * (1 - k * k);
            } else {
                const t = smooth(w, w * 3.2, d);
                out = shore + (h - shore) * t;
            }
            return Math.min(h, out);
        }

        const riverX = (z) => -40 + 70 * Math.sin(z / 110 + 0.5) + 40 * Math.sin(z / 47 + 2);
        const riverPts = [], riverWidths = [];
        for (let z = -300; z <= 300; z += 6) {
            riverPts.push({ x: riverX(z), z });
            riverWidths.push(13 + 3.5 * Math.sin(z / 70 + 1));
        }

        function makeStream(sx, sz, ex, ez, w0, w1, wiggle, seed) {
            const pts = [], ws = [];
            const steps = 70;
            const dx = ex - sx, dz = ez - sz, len = Math.hypot(dx, dz);
            const nx = -dz / len, nz = dx / len;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const env = Math.min(1, t * 8) * Math.min(1, (1 - t) * 8);
                const off = (Math.sin(t * Math.PI * 4 + seed) * wiggle + Math.sin(t * Math.PI * 11 + seed * 2) * wiggle * 0.25) * env;
                pts.push({ x: sx + dx * t + nx * off, z: sz + dz * t + nz * off });
                ws.push(w0 + (w1 - w0) * t);
            }
            return { pts, ws };
        }
        const streamA = makeStream(-292, -210, riverX(-100), -100, 3, 5.5, 16, 1.3);
        const streamB = makeStream(292, 110, riverX(-60), -60, 3.2, 6, 22, 4);

        const waterways = [
            buildWaterway(riverPts, riverWidths, 1.7),
            buildWaterway(streamA.pts, streamA.ws, 1.0),
            buildWaterway(streamB.pts, streamB.ws, 1.0),
        ];

        function terrainAt(x, z) {
            const edge = smooth(0, 45, SOIL_HALF - Math.max(Math.abs(x), Math.abs(z)));
            const hills = Math.max(0, fbm2(x / 150 + 10, z / 150 + 20, 4) - 0.38) * 24;
            const bumps = (fbm2(x / 16 + 3, z / 16 + 7, 2) - 0.5) * 1.4;
            let h = soilSurfaceY + hills * (0.12 + 0.88 * edge) + bumps * (0.5 + 0.5 * edge);
            for (const ww of waterways) {
                waterDist(ww, x, z);
                h = carve(h, wdD, wdW, ww.depth);
            }
            return h;
        }

        const TERRAIN_SEGMENTS = 384;
        const TERRAIN_STEP = SOIL_SIZE / TERRAIN_SEGMENTS;
        const TERRAIN_W = TERRAIN_SEGMENTS + 1;
        const hGrid = new Float32Array(TERRAIN_W * TERRAIN_W);
        let terrainMesh = null;

        function groundHeight(x, z) {
            const gx = clamp((x + SOIL_HALF) / TERRAIN_STEP, 0, TERRAIN_SEGMENTS - 1e-4);
            const gz = clamp((z + SOIL_HALF) / TERRAIN_STEP, 0, TERRAIN_SEGMENTS - 1e-4);
            const ix = Math.floor(gx), iz = Math.floor(gz);
            const tx = gx - ix, tz = gz - iz;
            const h00 = hGrid[iz * TERRAIN_W + ix], h10 = hGrid[iz * TERRAIN_W + ix + 1];
            const h01 = hGrid[(iz + 1) * TERRAIN_W + ix], h11 = hGrid[(iz + 1) * TERRAIN_W + ix + 1];
            return h00 * (1 - tx) * (1 - tz) + h10 * tx * (1 - tz) + h01 * (1 - tx) * tz + h11 * tx * tz;
        }

        function landPoint(margin, minH, avoidCenterR = 0) {
            let x = 0, z = 0;
            for (let t = 0; t < 80; t++) {
                x = rnd(-margin, margin);
                z = rnd(-margin, margin);
                if (groundHeight(x, z) >= minH && Math.hypot(x, z) >= avoidCenterR) break;
            }
            return [x, z];
        }

        function createTerrain() {
            const geo = new THREE.PlaneGeometry(SOIL_SIZE, SOIL_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
            geo.rotateX(-Math.PI / 2);
            geo.setAttribute('uv2', geo.attributes.uv.clone());
            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), z = pos.getZ(i);
                const h = terrainAt(x, z);
                pos.setY(i, h);
                const ix = Math.round((x + SOIL_HALF) / TERRAIN_STEP);
                const iz = Math.round((z + SOIL_HALF) / TERRAIN_STEP);
                hGrid[iz * TERRAIN_W + ix] = h;

                // Vertex tint: dry soil -> grassy patches -> sandy wet banks -> dark river bed
                const patch = smooth(0.34, 0.62, fbm2(x / 70 + 40, z / 70 + 11, 2)) * 0.85 + 0.1;
                let r = 1.0 + (0.74 - 1.0) * patch;
                let g = 0.95 + (1.0 - 0.95) * patch;
                let b = 0.88 + (0.5 - 0.88) * patch;
                const wet = smooth(WATER_Y + 1.2, WATER_Y + 0.1, h) * 0.9;
                r += (1.05 - r) * wet; g += (0.97 - g) * wet; b += (0.78 - b) * wet;
                const sub = 1 - 0.5 * smooth(WATER_Y, WATER_Y - 1.0, h);
                colors[i * 3] = r * sub;
                colors[i * 3 + 1] = g * sub;
                colors[i * 3 + 2] = b * sub;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();

            terrainMesh = new THREE.Mesh(geo, soilMaterial);
            terrainMesh.castShadow = true;
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);

            // Soil "skirt" so the edges of the world are sealed down to the desk.
            const bottom = -0.45;
            const positions = [], uvs = [], cols = [], indices = [];
            const edges = [
                (i) => [-SOIL_HALF + i * TERRAIN_STEP, -SOIL_HALF],
                (i) => [SOIL_HALF, -SOIL_HALF + i * TERRAIN_STEP],
                (i) => [SOIL_HALF - i * TERRAIN_STEP, SOIL_HALF],
                (i) => [-SOIL_HALF, SOIL_HALF - i * TERRAIN_STEP],

            for (const edge of edges) {

                    uvs.push(i / TERRAIN_SEGMENTS, (h - bottom) / SOIL_SIZE, i / TERRAIN_SEGMENTS, 0);
                    cols.push(0.62, 0.55, 0.45, 0.45, 0.4, 0.34);

                for (let i = 0; i < TERRAIN_SEGMENTS; i++) {
                    const a = base + i * 2, b = a + 1, c = a + 2, d = a + 3;

            skirt.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        // ---- Water (river + streams share one flat water sheet; terrain carves the channels)
        let waterMaterial = null;
        function createWater() {
            const S = 256;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const ctx = c.getContext('2d');
            const img = ctx.createImageData(S, S);
            const hf = (x, y) => {
                const u = (x / S) * Math.PI * 2, v = (y / S) * Math.PI * 2;
                return Math.sin(u * 3 + Math.sin(v * 2) * 1.2) * 0.5 + Math.sin(v * 4 + u * 2) * 0.35 + Math.sin(u * 7 - v * 5) * 0.15;
            };
            for (let y = 0; y < S; y++) {
                for (let x = 0; x < S; x++) {
                    const dx = hf(x + 1, y) - hf(x - 1, y);
                    const dy = hf(x, y + 1) - hf(x, y - 1);
                    let nx = -dx * 5, ny = -dy * 5, nz = 1;
                    const len = Math.hypot(nx, ny, nz);
                    nx /= len; ny /= len; nz /= len;
                    const i = (y * S + x) * 4;
                    img.data[i] = 128 + nx * 127;
                    img.data[i + 1] = 128 + ny * 127;
                    img.data[i + 2] = 128 + nz * 127;
                    img.data[i + 3] = 255;
                }

            ctx.putImageData(img, 0, 0);

            normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;

        // ---- Wind sway shared by instanced grass + trees
        const swayUniforms = { uTime: { value: 0 }, uAmp: { value: 1 } };
        function enableSway(material, key, body) {
            material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = swayUniforms.uTime;
                shader.uniforms.uAmp = swayUniforms.uAmp;
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform float uAmp;')
                    .replace('#include <begin_vertex>',
                        '#include <begin_vertex>\nfloat swPh = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.53;\nfloat swH = max(position.y, 0.0);\n' + body);
            };
            material.customProgramCacheKey = () => key;
        }

        // ---- Tree colliders (so you can't walk through trunks)
        const COLLIDER_CELL = 24;
        const colliderCells = new Map();
        function addCollider(x, z, r) {
            const key = Math.floor(x / COLLIDER_CELL) + ',' + Math.floor(z / COLLIDER_CELL);
            if (!colliderCells.has(key)) colliderCells.set(key, []);
            colliderCells.get(key).push({ x, z, r });
        }
        function resolveCollisions(pos) {
            const cx = Math.floor(pos.x / COLLIDER_CELL), cz = Math.floor(pos.z / COLLIDER_CELL);
            for (let dx = -1; dx <= 1; dx++) {
                for (let dz = -1; dz <= 1; dz++) {
                    const list = colliderCells.get((cx + dx) + ',' + (cz + dz));
                    if (!list) continue;
                    for (const c of list) {
                        const ox = pos.x - c.x, oz = pos.z - c.z;
                        const minD = c.r + 0.45;
                        const d2 = ox * ox + oz * oz;
                        if (d2 < minD * minD && d2 > 1e-6) {
                            const d = Math.sqrt(d2);
                            pos.x = c.x + (ox / d) * minD;
                            pos.z = c.z + (oz / d) * minD;
                        }
                    }
                }
            }
        }

        // ---- Trees
        function prepGeo(geo, hex) {
            const g = geo.index ? geo.toNonIndexed() : geo;
            const col = new THREE.Color(hex);
            const n = g.attributes.position.count;
            const arr = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) { arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b; }
            g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
            return g;
        }
        function lumpy(geo, amount) {
            const p = geo.attributes.position;
            for (let i = 0; i < p.count; i++) {
                const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
                const k = 1 + amount * Math.sin(x * 2.7 + y * 1.9) * Math.cos(z * 2.3 - y * 1.3);
                p.setXYZ(i, x * k, y * k, z * k);
            }
            return geo;
        }
        function blob(radius, x, y, z, hex, lump = 0.18) {
            const ico = lumpy(new THREE.IcosahedronGeometry(radius, 1), lump);
            ico.translate(x, y, z);
            return prepGeo(ico, hex);
        }
        function buildPine() {
            const parts = [];
            const trunk = new THREE.CylinderGeometry(0.28, 0.5, 3.2, 6, 1);
            trunk.translate(0, 1.6, 0);
            parts.push(prepGeo(trunk, 0x5a3d26));
            const tiers = [[3.4, 4.2, 2.4], [2.8, 3.8, 4.4], [2.2, 3.4, 6.2], [1.5, 3.0, 7.9], [0.8, 2.2, 9.4]];
            tiers.forEach(([r, h, y], i) => {
                const cone = new THREE.ConeGeometry(r, h, 8, 1);
                cone.translate(0, y + h / 2, 0);

            return mergeGeometries(parts);

        function buildOak() {
            const parts = [];
            const trunk = new THREE.CylinderGeometry(0.45, 0.8, 4.2, 7, 1);
            trunk.translate(0, 2.1, 0);
            parts.push(prepGeo(trunk, 0x604226));
            parts.push(blob(3.1, 0, 6.4, 0, 0x4f8a3a));
            parts.push(blob(2.3, -2.0, 5.4, 0.8, 0x467d34));
            parts.push(blob(2.4, 2.1, 5.6, -0.6, 0x558f3d));
            parts.push(blob(2.2, 0.4, 7.8, 0.6, 0x5a9642));
            parts.push(blob(2.2, -0.8, 5.5, -2.0, 0x4a8237));
            parts.push(blob(2.1, 1.0, 5.4, 2.0, 0x4f8a3a));
            return mergeGeometries(parts);
        }
        function buildBirch() {
            const parts = [];
            const trunk = new THREE.CylinderGeometry(0.2, 0.32, 7.5, 6, 1);
            trunk.translate(0, 3.75, 0);
            parts.push(prepGeo(trunk, 0xe8e4d8));
            parts.push(blob(1.9, 0, 8.2, 0, 0x8fbf4f));
            parts.push(blob(1.4, 0.9, 6.8, 0.4, 0x84b448));
            parts.push(blob(1.5, -0.9, 7.2, -0.5, 0x96c556));
            parts.push(blob(1.2, 0.2, 9.5, 0.1, 0x9ccb5c));
            return mergeGeometries(parts);
        }

        function createTrees() {
            const treeMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0, flatShading: true });
            enableSway(treeMaterial, 'tree-sway',
                'float swB = pow(swH / 11.0, 2.0) * 0.55 * uAmp;\n' +
                'transformed.x += sin(uTime * 0.9 + swPh) * swB;\n' +
                'transformed.z += cos(uTime * 0.7 + swPh * 1.3) * swB * 0.5;');

            const kinds = [
                { geo: buildPine(), count: 380, scale: [0.8, 1.7], collide: 0.5, seed: 50 },
                { geo: buildOak(), count: 300, scale: [0.8, 1.5], collide: 0.75, seed: 130 },
                { geo: buildBirch(), count: 240, scale: [0.8, 1.4], collide: 0.3, seed: 210 },
            ];
            const dummy = new THREE.Object3D();
            const tint = new THREE.Color();

            for (const kind of kinds) {
                const mesh = new THREE.InstancedMesh(kind.geo, treeMaterial, kind.count);
                let placed = 0, attempts = 0;
                while (placed < kind.count && attempts < kind.count * 60) {
                    attempts++;
                    const x = rnd(-SOIL_HALF + 6, SOIL_HALF - 6), z = rnd(-SOIL_HALF + 6, SOIL_HALF - 6);
                    const gy = groundHeight(x, z);
                    if (gy < WATER_Y + 1.1) continue;
                    if (Math.hypot(x, z) < 9) continue;
                    if (fbm2(x / 75 + kind.seed, z / 75 + kind.seed * 1.7, 3) < 0.47 && Math.random() > 0.05) continue;

                    const s = rnd(kind.scale[0], kind.scale[1]);
                    dummy.position.set(x, gy - 0.15, z);
                    dummy.rotation.set(rnd(-0.04, 0.04), rnd(0, Math.PI * 2), rnd(-0.04, 0.04));
                    dummy.scale.set(s * rnd(0.9, 1.1), s, s * rnd(0.9, 1.1));
                    dummy.updateMatrix();
                    mesh.setMatrixAt(placed, dummy.matrix);
                    tint.setRGB(rnd(0.82, 1.12), rnd(0.88, 1.12), rnd(0.8, 1.05));
                    mesh.setColorAt(placed, tint);
                    addCollider(x, z, kind.collide * s);
                    placed++;
                }
                mesh.count = placed;
                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.frustumCulled = false;
                scene.add(mesh);
            }
        }

        // ---- Contact shadows
        const contactCanvas = document.createElement('canvas');
        contactCanvas.width = 128;
        contactCanvas.height = 128;
        const contactContext = contactCanvas.getContext('2d');
        const contactGradient = contactContext.createRadialGradient(64, 64, 2, 64, 64, 64);
        contactGradient.addColorStop(0, 'rgba(35, 24, 15, 0.42)');
        contactGradient.addColorStop(0.4, 'rgba(35, 24, 15, 0.2)');
        contactGradient.addColorStop(1, 'rgba(35, 24, 15, 0)');
        contactContext.fillStyle = contactGradient;
        contactContext.fillRect(0, 0, 128, 128);

        const contactTexture = new THREE.CanvasTexture(contactCanvas);
        const contactGeometry = new THREE.PlaneGeometry(1, 1);
        const contactMaterial = new THREE.MeshBasicMaterial({
            map: contactTexture,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
            toneMapped: false,
            polygonOffset: true,
            polygonOffsetFactor: -1,
        });

        function addContactAO(x, z, size) {
            const contactAO = new THREE.Mesh(contactGeometry, contactMaterial);
            contactAO.rotation.x = -Math.PI / 2;
            contactAO.position.set(x, groundHeight(x, z) + 0.05, z);
            contactAO.scale.set(size, size, 1);
            contactAO.renderOrder = 1;
            scene.add(contactAO);
        }

        const groundPos = (x, z, lift = 0) => new THREE.Vector3(x, groundHeight(x, z) + lift, z);

        // ---- Grass: instanced blades with GPU wind sway
        function createGrass(count) {
            const grassGeometry = new THREE.CylinderGeometry(0.003, 0.06, 1, 3, 2, true);
            grassGeometry.translate(0, 0.5, 0);
            const grassMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0, side: THREE.DoubleSide });
            enableSway(grassMaterial, 'grass-sway',
                'float swB = swH * swH * 0.34 * uAmp;\n' +
                'transformed.x += sin(uTime * 1.35 + swPh) * swB;\n' +
                'transformed.z += cos(uTime * 1.05 + swPh * 1.3) * swB * 0.4;');

            const mesh = new THREE.InstancedMesh(grassGeometry, grassMaterial, count);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            let placed = 0;
            const perClump = 14;

            while (placed < count) {
                const [cx, cz] = landPoint(SOIL_HALF - 2, WATER_Y + 0.3);
                const radius = rnd(1.5, 4.5);
                for (let k = 0; k < perClump && placed < count; k++) {
                    const a = rnd(0, Math.PI * 2), d = Math.sqrt(Math.random()) * radius;
                    const x = clamp(cx + Math.cos(a) * d, -SOIL_HALF + 1, SOIL_HALF - 1);
                    const z = clamp(cz + Math.sin(a) * d, -SOIL_HALF + 1, SOIL_HALF - 1);
                    const gy = groundHeight(x, z);
                    if (gy < WATER_Y + 0.2) continue;
                    const height = rnd(0.5, 1.2);
                    dummy.position.set(x, gy - 0.02, z);
                    dummy.rotation.set(rnd(-0.09, 0.09), rnd(0, Math.PI * 2), rnd(-0.09, 0.09));
                    dummy.scale.set(1, height, 1);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(placed, dummy.matrix);
                    color.setHSL(rnd(0.22, 0.29), rnd(0.45, 0.65), rnd(0.26, 0.4));
                    mesh.setColorAt(placed, color);
                    placed++;
                }
            }
            mesh.instanceMatrix.needsUpdate = true;
            if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
            mesh.frustumCulled = false;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // ---- Rocks
        function createRocks(count) {
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x8f8f8f, roughness: 0.9, metalness: 0.08 });

            for (let i = 0; i < count; i++) {
                const size = Math.random() < 0.1 ? 2.4 + Math.random() * 3.2 : 0.56 + Math.random() * 0.9;
                const rockGeometry = new THREE.DodecahedronGeometry(size, 0);
                const rock = new THREE.Mesh(rockGeometry, rockMaterial);

                const [x, z] = landPoint(SOIL_HALF - 3, WATER_Y - 0.8, 5.5);
                const gy = groundHeight(x, z);

                rock.position.set(x, gy + size * 0.55, z);
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

                rock.scale.set(1.2, 0.8, 1.1);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
                if (size < 2) addContactAO(x, z, size * 2.2);
                replaceWithModel(
                    rock,
                    'rocks.glb',
                    size * 2,
                    new THREE.Vector3(x, gy - size * 0.12, z),
                    (model) => {
                        model.rotation.y = rock.rotation.y;
                    }
                );
            }
        }

        // ---- Glowing mushrooms
        function createGlowingMushrooms(count) {
            const mushroomMaterial = new THREE.MeshStandardMaterial({
                color: 0xff66ff, emissive: 0xff66ff, emissiveIntensity: 0.8, roughness: 0.5, metalness: 0.2,
            });
            const stemMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8, metalness: 0 });

            for (let i = 0; i < count; i++) {
                const stemHeight = 0.64 + Math.random() * 0.6;
                const stemRadius = 0.11 + Math.random() * 0.08;
                const capRadius = 0.28 + Math.random() * 0.16;

                const stemGeometry = new THREE.CylinderGeometry(stemRadius * 0.75, stemRadius, stemHeight, 8, 4);
                const stem = new THREE.Mesh(stemGeometry, stemMaterial);

                const capGeometry = new THREE.SphereGeometry(capRadius, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2);
                const cap = new THREE.Mesh(capGeometry, mushroomMaterial);

                const [x, z] = landPoint(SOIL_HALF - 2, WATER_Y + 0.6, 5);

                stem.position.y = stemHeight / 2;
                cap.position.y = stemHeight;

                cap.rotation.x = Math.random() * 0.3 - 0.15;
                cap.rotation.z = Math.random() * 0.3 - 0.15;

                stem.castShadow = true;
                stem.receiveShadow = true;
                cap.castShadow = true;
                cap.receiveShadow = true;

                const plant = new THREE.Group();
                plant.position.copy(groundPos(x, z));
                plant.add(stem, cap);
                scene.add(plant);
                addContactAO(x, z, capRadius * 3.2);
                glowingMushrooms.push(stem, cap);
                const swayEntry = { plant, phase: Math.random() * Math.PI * 2 };
                swayingMushrooms.push(swayEntry);
                replaceWithModel(
                    plant,
                    'mushroom.glb',
                    stemHeight * 1.55,
                    groundPos(x, z),
                    (model) => {
                        model.rotation.y = Math.random() * Math.PI * 2;
                        model.traverse((object) => {
                            if (object.isMesh && object.material && object.material.emissive) {
                                object.material.emissive.setHex(0x24102c);
                                object.material.emissiveIntensity = 0.16;
                            }
                        });
                        swayEntry.plant = model;
                    }
                );
            }
        }

        // ---- Ferns
        const fernStemMaterial = new THREE.MeshStandardMaterial({ color: 0x527c3c, roughness: 0.86 });
        const fernLeafMaterial = new THREE.MeshStandardMaterial({ color: 0x6f9b4d, roughness: 0.78, side: THREE.DoubleSide });
        const fernLeafGeometry = new THREE.SphereGeometry(1, 8, 6);
        const fernStemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.02, 0),
            new THREE.Vector3(0.015, 0.28, 0),
            new THREE.Vector3(0, 0.62, 0),
        ]);
        const fernStemGeometry = new THREE.TubeGeometry(fernStemCurve, 10, 0.009, 5, false);

        function createFern(x, z) {
            const fern = new THREE.Group();
            fern.position.copy(groundPos(x, z));

            for (let frondIndex = 0; frondIndex < 5; frondIndex++) {
                const frond = new THREE.Group();
                frond.rotation.y = (frondIndex / 5) * Math.PI * 2;
                frond.rotation.z = -0.22;
                fern.add(frond);

                const stem = new THREE.Mesh(fernStemGeometry, fernStemMaterial);
                stem.castShadow = true;
                frond.add(stem);

                for (let leafletIndex = 0; leafletIndex < 4; leafletIndex++) {
                    const height = 0.13 + leafletIndex * 0.12;
                    for (const side of [-1, 1]) {
                        const leaflet = new THREE.Mesh(fernLeafGeometry, fernLeafMaterial);
                        leaflet.position.set(side * (0.055 + leafletIndex * 0.014), height, 0);
                        leaflet.rotation.z = side * 0.62;
                        leaflet.scale.set(0.058, 0.14, 0.024);
                        leaflet.castShadow = true;
                        frond.add(leaflet);
                    }
                }
            }

            scene.add(fern);
            addContactAO(x, z, 0.58);
            const swayEntry = { plant: fern, phase: Math.random() * Math.PI * 2 };
            swayingFerns.push(swayEntry);
            replaceWithModel(fern, 'fern.glb', 1.8, groundPos(x, z), (model) => {
                swayEntry.plant = model;
            });
        }

        // ---- Frog
        function createFrog(x, z) {
            const frogGroup = new THREE.Group();
            frogGroup.position.copy(groundPos(x, z));

            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0x68a44d, roughness: 0.68 });
            const darkSkinMaterial = new THREE.MeshStandardMaterial({ color: 0x3f713d, roughness: 0.78 });
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xf6f0d9, roughness: 0.35 });
            const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x18251b, roughness: 0.28 });
            const sphereGeometry = new THREE.SphereGeometry(1, 18, 14);

            function addPart(material, position, scale) {
                const part = new THREE.Mesh(sphereGeometry, material);
                part.position.set(position.x, position.y, position.z);
                part.scale.set(scale.x, scale.y, scale.z);
                part.castShadow = true;
                part.receiveShadow = true;
                frogGroup.add(part);
                return part;
            }

            const body = addPart(skinMaterial, { x: 0, y: 0.24, z: 0 }, { x: 0.38, y: 0.25, z: 0.49 });
            addPart(skinMaterial, { x: 0, y: 0.43, z: 0.34 }, { x: 0.3, y: 0.24, z: 0.29 });

            for (const side of [-1, 1]) {
                addPart(skinMaterial, { x: side * 0.2, y: 0.62, z: 0.48 }, { x: 0.105, y: 0.13, z: 0.105 });
                addPart(eyeMaterial, { x: side * 0.2, y: 0.63, z: 0.565 }, { x: 0.073, y: 0.083, z: 0.06 });
                addPart(pupilMaterial, { x: side * 0.2, y: 0.63, z: 0.616 }, { x: 0.036, y: 0.047, z: 0.026 });
                addPart(darkSkinMaterial, { x: side * 0.075, y: 0.54, z: 0.603 }, { x: 0.018, y: 0.014, z: 0.012 });
                addPart(skinMaterial, { x: side * 0.28, y: 0.13, z: 0.29 }, { x: 0.11, y: 0.1, z: 0.2 });
                addPart(skinMaterial, { x: side * 0.3, y: 0.13, z: -0.24 }, { x: 0.17, y: 0.12, z: 0.23 });
                for (let toeIndex = 0; toeIndex < 3; toeIndex++) {
                    addPart(skinMaterial, {
                        x: side * (0.3 + (toeIndex - 1) * 0.065),
                        y: 0.065,
                        z: 0.45,
                    }, { x: 0.045, y: 0.04, z: 0.1 });
                }
            }

            for (let spotIndex = 0; spotIndex < 4; spotIndex++) {
                addPart(darkSkinMaterial, {
                    x: (spotIndex % 2 === 0 ? -1 : 1) * 0.18,
                    y: 0.43,
                    z: -0.18 + Math.floor(spotIndex / 2) * 0.2,
                }, { x: 0.055, y: 0.025, z: 0.07 });
            }

            frogGroup.userData.body = body;
            frogGroup.userData.breathPhase = Math.random() * Math.PI * 2;
            scene.add(frogGroup);
            addContactAO(x, z, 0.9);
            replaceWithModel(frogGroup, 'tree-frog.glb', 1.55, groundPos(x, z), (model, gltf) => {
                frog = model;
                model.rotation.y = 0;
                model.traverse((object) => {
                    if (!object.isMesh) return;
                    for (const material of Array.isArray(object.material) ? object.material : [object.material]) {
                        if (!material) continue;
                        material.metalness = 0;
                        material.roughness = 0.72;
                    }
                });
                if (gltf.animations.length > 0) {
                    frogMixer = new THREE.AnimationMixer(model);
                    const idleAnimation = gltf.animations.find((clip) => clip.name.toLowerCase().includes('idle')) || gltf.animations[0];
                    frogMixer.clipAction(idleAnimation).play();
                }
            });
            return frogGroup;
        }

        // Weather system
        let currentWeather = 'sunny';
        // Fog is only present on rainy days, and is much lighter than before.
        const fogThemes = {
            sunny: { outdoorColor: 0xbdd1b3, interiorColor: 0xf0c4a6, outdoorDensity: 0.0, interiorDensity: 0.0 },
            rainy: { outdoorColor: 0x91a893, interiorColor: 0xa9b9b0, outdoorDensity: 0.0009, interiorDensity: 0.0035 },
            night: { outdoorColor: 0x2c3c36, interiorColor: 0x293353, outdoorDensity: 0.0, interiorDensity: 0.0 },
        };
        const swayAmpByWeather = { sunny: 1.0, rainy: 1.8, night: 0.7 };
        let swayAmpTarget = 1.0;
        const fogColorTarget = new THREE.Color(fogThemes.sunny.outdoorColor);
        let fogDensityTarget = fogThemes.sunny.outdoorDensity;
        let rainIntensity = 0.55;
        let rainBox = RAIN_BOX_OVERVIEW;
        let godRayEnabled = true;
        let godRayTargetIntensity = 0;
        let godRayIntensity = 0;
        let rainSystem = null;
        let splashSystem = null;
        let firefly = null;
        let fireflyLight = null;
        let frog = null;
        let frogMixer = null;
        let ambientParticles = null;
        let ambientParticlesData = [];
        let time = 0;
        let fireflyStartled = false;
        let fireflyStartledTime = 0;
        let glowingMushrooms = [];
        const swayingMushrooms = [];
        const swayingFerns = [];

        // Generate the world
        createTerrain();
        createWater();
        createTrees();
        createGrass(36000);
        createRocks(80);
        createGlowingMushrooms(120);
        createFern(-1.15, 0.65);
        for (let i = 0; i < 60; i++) {
            const [fx, fz] = landPoint(SOIL_HALF - 3, WATER_Y + 0.6, 4);
            createFern(fx, fz);
        }
        frog = createFrog(0.35, 0.35);

        // --- Bugs & animals --------------------------------------------------------
        const critters = [];
        const cMat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.65, ...extra });
        const ball = new THREE.SphereGeometry(1, 10, 8);
        function part(group, material, [x, y, z], [sx, sy, sz]) {
            const m = new THREE.Mesh(ball, material);
            m.position.set(x, y, z);
            m.scale.set(sx, sy, sz);
            m.castShadow = true;
            group.add(m);
            return m;
        }
        function makeLadybug() {
            const g = new THREE.Group(), red = cMat(0xd62828), black = cMat(0x111111);
            part(g, red, [0, 0.1, 0], [0.17, 0.11, 0.21]);
            part(g, black, [0, 0.09, 0.19], [0.09, 0.07, 0.07]);
            for (const s of [-1, 1]) for (const z of [-0.06, 0.07]) part(g, black, [s * 0.08, 0.19, z], [0.03, 0.02, 0.03]);
            return g;
        }
        function makeBeetle() {
            const g = new THREE.Group(), shell = cMat(0x1f6f5c, { metalness: 0.6, roughness: 0.3 }), dark = cMat(0x14211c);
            part(g, shell, [0, 0.12, 0], [0.15, 0.11, 0.3]);
            part(g, dark, [0, 0.1, 0.3], [0.09, 0.07, 0.09]);
            for (const s of [-1, 1]) for (const z of [-0.12, 0, 0.12]) part(g, dark, [s * 0.17, 0.04, z], [0.07, 0.02, 0.02]);
            return g;
        }
        function makeSnail() {
            const g = new THREE.Group(), body = cMat(0xd9c7a0);
            part(g, body, [0, 0.07, 0], [0.13, 0.07, 0.38]);
            part(g, body, [0, 0.16, 0.34], [0.09, 0.1, 0.09]);
            part(g, cMat(0x8a5a2b), [0, 0.27, -0.08], [0.2, 0.22, 0.2]);
            for (const s of [-1, 1]) part(g, body, [s * 0.04, 0.32, 0.4], [0.015, 0.1, 0.015]);
            return g;
        }
        const spikeGeo = new THREE.ConeGeometry(0.035, 0.2, 5);
        let hedgehogSpikes = null;
        function getHedgehogSpikes() {
            if (hedgehogSpikes) return hedgehogSpikes;
            const up = new THREE.Vector3(0, 1, 0);
            const pieces = [];
            for (let i = 0; i < 70; i++) {
                const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI * 0.5;
                const dir = new THREE.Vector3(Math.sin(a) * Math.cos(b), Math.sin(b), Math.cos(a) * Math.cos(b));
                const sp = spikeGeo.clone();
                const m = new THREE.Matrix4().compose(
                    new THREE.Vector3(dir.x * 0.4, 0.38 + dir.y * 0.33, -0.05 + dir.z * 0.55),
                    new THREE.Quaternion().setFromUnitVectors(up, dir),
                    new THREE.Vector3(1, 1, 1)
                );
                sp.applyMatrix4(m);
                pieces.push(sp);
            }
            hedgehogSpikes = mergeGeometries(pieces);
            return hedgehogSpikes;
        }
        function makeHedgehog() {
            const g = new THREE.Group(), spike = cMat(0x3b2a1b);
            part(g, spike, [0, 0.38, -0.05], [0.4, 0.33, 0.55]);
            part(g, cMat(0xd8b894), [0, 0.22, 0.5], [0.17, 0.17, 0.25]);
            part(g, cMat(0x111111), [0, 0.24, 0.74], [0.04, 0.04, 0.04]);
            const spikes = new THREE.Mesh(getHedgehogSpikes(), spike);
            spikes.castShadow = true;
            g.add(spikes);
            return g;
        }
        function makeToad() {
            const g = new THREE.Group(), skin = cMat(0x8a7a4a), eye = cMat(0x111111);
            part(g, skin, [0, 0.25, 0], [0.33, 0.24, 0.42]);
            part(g, skin, [0, 0.36, 0.3], [0.24, 0.18, 0.22]);
            for (const s of [-1, 1]) {
                part(g, eye, [s * 0.15, 0.52, 0.38], [0.06, 0.06, 0.06]);
                part(g, skin, [s * 0.28, 0.1, -0.2], [0.12, 0.1, 0.22]);
            }
            return g;
        }
        function makeButterfly(color) {
            const g = new THREE.Group(), wingMat = cMat(color, { side: THREE.DoubleSide, emissive: color, emissiveIntensity: 0.15 });
            part(g, cMat(0x222222), [0, 0, 0], [0.03, 0.03, 0.16]);
            g.userData.wings = [-1, 1].map((s) => {
                const pivot = new THREE.Group();
                g.add(pivot);
                part(pivot, wingMat, [s * 0.16, 0, -0.03], [0.17, 0.012, 0.13]);
                return { pivot, s };
            });
            return g;
        }
        function makeDragonfly() {
            const g = new THREE.Group(), body = cMat(0x1d8fa8, { metalness: 0.4, roughness: 0.3 });
            const wingMat = cMat(0xcfeeff, { transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            part(g, body, [0, 0, 0], [0.04, 0.04, 0.34]);
            part(g, body, [0, 0, 0.36], [0.06, 0.06, 0.07]);
            g.userData.wings = [];
            g.userData.fast = true;
            for (const s of [-1, 1]) for (const z of [0.1, -0.02]) {
                const pivot = new THREE.Group();
                pivot.position.set(0, 0.03, z);
                g.add(pivot);
                part(pivot, wingMat, [s * 0.3, 0, 0], [0.3, 0.008, 0.07]);

                else [x, z] = landPoint(m, WATER_Y + 0.5, 3);
                g.position.set(x, groundHeight(x, z), z);
                scene.add(g);
                critters.push({ g, kind, speed: speed * rnd(0.7, 1.3), heading: rnd(0, 6.28), t: rnd(0, 20), seed: rnd(0, 6.28), alt: alt * rnd(0.6, 1.4), wait: 0, hop: 0 });

        const CRITTER_CULL_DIST_SQ = 220 * 220;
        function updateCritters(dt) {
            const limit = SOIL_HALF - 1.2;
            const cp = camera.position;
            for (const c of critters) {
                const g = c.g, p = g.position;
                const ddx = p.x - cp.x, ddy = p.y - cp.y, ddz = p.z - cp.z;
                if (ddx * ddx + ddy * ddy + ddz * ddz > CRITTER_CULL_DIST_SQ) { g.visible = false; continue; }
                g.visible = true;

                c.t += dt;
                if (Math.abs(p.x) > limit || Math.abs(p.z) > limit) c.heading = Math.atan2(-p.x, -p.z) + rnd(-0.5, 0.5);
                let moving = true;
                if (c.kind === 'hop') {
                    if (c.wait > 0) { c.wait -= dt; moving = false; }
                    else {
                        c.hop += dt / 0.55;
                        if (c.hop >= 1) { c.hop = 0; c.wait = rnd(0.8, 4); c.heading += rnd(-1.2, 1.2); }
                    }
                } else {
                    c.heading += Math.sin(c.t * 0.6 + c.seed) * dt * (c.kind === 'fly' ? 1.4 : 0.9);
                }
                if (moving) {
                    const nx = p.x + Math.sin(c.heading) * c.speed * dt;
                    const nz = p.z + Math.cos(c.heading) * c.speed * dt;
                    if (c.kind !== 'fly' && groundHeight(nx, nz) < WATER_Y + 0.15) {
                        c.heading += Math.PI * rnd(0.6, 1.4);   // land critters turn away from the water
                    } else {
                        p.x = nx;
                        p.z = nz;
                    }
                }
                const gy = groundHeight(p.x, p.z);
                p.y = c.kind === 'fly' ? gy + c.alt + Math.sin(c.t * 1.2 + c.seed) * 1.2
                    : c.kind === 'hop' ? gy + Math.sin(c.hop * Math.PI) * 0.9 : gy;
                g.rotation.y = c.heading;
                const wings = g.userData.wings;
                if (wings) for (const w of wings) {
                    w.pivot.rotation.z = g.userData.fast
                        ? w.s * Math.sin(c.t * 45) * 0.35
                        : w.s * (0.2 + Math.abs(Math.sin(c.t * 16 + c.seed)) * 0.9);
                }
            }
        }

        function createRippleEffect() {

        function spawnRipple(position, k = 1) {
            if (!rippleSystem) createRippleEffect();
            rippleSystem.material.size = 0.06 * k;

            const positions = rippleSystem.geometry.attributes.position.array;
            const velocities = rippleSystem.geometry.userData.velocities;
            const lifetimes = rippleSystem.geometry.userData.lifetimes;

            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < lifetimes.length; j++) {
                    if (lifetimes[j] <= 0) {
                        positions[j * 3] = position.x;
                        positions[j * 3 + 1] = position.y;
                        positions[j * 3 + 2] = position.z;

                        const angle = (i / 10) * Math.PI * 2;
                        velocities[j] = {
                            x: Math.cos(angle) * 0.03 * k,
                            y: (Math.random() - 0.5) * 0.02 * k,
                            z: Math.sin(angle) * 0.03 * k
                        };
                        lifetimes[j] = 1;
                        break;
                    }
                }
            }

        // Audio
        let audioContext = null;

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

        function playGlassTap() {
            if (!audioEnabled) return;
            initAudioContext();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(2000, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.15);
        }

        function createRainSound() {
            stopAmbientSound();
            if (!audioEnabled) return;
            initAudioContext();

            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioContext.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const highpass = audioContext.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 140;

            const lowpass = audioContext.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 2400;

            const gain = audioContext.createGain();
            gain.gain.value = 0.035;

            const lfo = audioContext.createOscillator();
            lfo.frequency.value = 0.12;
            const lfoGain = audioContext.createGain();
            lfoGain.gain.value = 0.009;
            lfo.connect(lfoGain);
            lfoGain.connect(gain.gain);

            whiteNoise.connect(highpass);
            highpass.connect(lowpass);
            lowpass.connect(gain);
            gain.connect(audioContext.destination);

            whiteNoise.start();
            lfo.start();
            ambientSource = whiteNoise;
            ambientGain = gain;
            ambientLFO = lfo;
        }

        function scheduleBirdCalls() {
            if (!audioEnabled || currentWeather !== 'sunny') return;

            const noteCount = 2 + Math.floor(Math.random() * 3);
            let noteOffset = 0;

            for (let i = 0; i < noteCount; i++) {
                const oscillator = audioContext.createOscillator();
                const envelope = audioContext.createGain();
                const start = audioContext.currentTime + noteOffset;
                const startFrequency = 2100 + Math.random() * 900;
                const endFrequency = startFrequency + (Math.random() - 0.35) * 900;

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(startFrequency, start);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(1200, endFrequency), start + 0.09);
                oscillator.frequency.exponentialRampToValueAtTime(startFrequency * 0.92, start + 0.19);
                envelope.gain.setValueAtTime(0.0001, start);
                envelope.gain.exponentialRampToValueAtTime(0.005, start + 0.025);
                envelope.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);

                oscillator.connect(envelope);
                envelope.connect(audioContext.destination);
                oscillator.start(start);
                oscillator.stop(start + 0.21);
                noteOffset += 0.12 + Math.random() * 0.08;
            }

            birdCallTimer = window.setTimeout(scheduleBirdCalls, 7000 + Math.random() * 11000);
        }

        function createWindSound() {
            stopAmbientSound();

            const bufferSize = 2 * audioContext.sampleRate;

            const whiteNoise = audioContext.createBufferSource();

            const highpass = audioContext.createBiquadFilter();

            lowpass.frequency.value = 650;
