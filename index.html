<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Terrarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.72), transparent 16%),
                radial-gradient(circle at 75% 18%, rgba(216, 238, 212, 0.38), transparent 20%),
                linear-gradient(180deg, #dfeccd 0%, #c9d9ba 22%, #b4c9a5 52%, #8ea37f 100%);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(transparent 0%, rgba(50, 72, 48, 0.12) 100%),
                radial-gradient(circle at 15% 65%, rgba(116, 169, 111, 0.14), transparent 18%),
                radial-gradient(circle at 80% 55%, rgba(69, 98, 79, 0.14), transparent 18%);
            pointer-events: none;
            z-index: 10;
        }
        canvas { display: block; width: 100vw; height: 100vh; filter: saturate(1.16) contrast(1.06) brightness(0.98); }
        .weather-controls {
            position: fixed; top: 26px; right: 26px; display: flex; gap: 12px; padding: 9px 11px;
            background: rgba(135, 151, 123, 0.28); border: 2px solid rgba(72, 89, 63, 0.2); border-radius: 999px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 7px 16px rgba(56, 72, 51, 0.14); z-index: 100;
        }
        .weather-btn {
            padding: 11px 20px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em;
            border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px; cursor: pointer;
            background: linear-gradient(180deg, rgba(244,245,238,0.72), rgba(214,220,207,0.7)); color: #40503c;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18);
        }
        .weather-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(75, 68, 61, 0.14); }
        .weather-btn.active {
            background: linear-gradient(135deg, #6f9b63 0%, #5a8555 44%, #466c47 100%); color: #f7f3ea;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(63, 95, 63, 0.28);
        }
        .rain-control {
            position: fixed; top: 100px; right: 26px; display: flex; align-items: center; gap: 10px;
            min-width: 248px; padding: 10px 13px; border: 2px solid rgba(72, 89, 63, 0.2); border-radius: 16px;
            background: rgba(135, 151, 123, 0.3); color: #40503c; font-size: 12px; font-weight: 800;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), 0 7px 16px rgba(56, 72, 51, 0.14); z-index: 100;
        }
        .rain-control[hidden] { display: none; }
        .rain-control input { flex: 1; min-width: 80px; accent-color: #5a8555; cursor: pointer; }
        .rain-control output { min-width: 3ch; text-align: right; }
        @media (max-width: 560px) {
            .rain-control { top: 98px; right: 16px; min-width: 0; width: 238px; }
        }
        .audio-toggle {
            position: fixed; top: 26px; left: 26px; padding: 11px 20px; font-size: 13px; font-weight: 800;
            letter-spacing: 0.04em; border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px; cursor: pointer;
            background: linear-gradient(180deg, rgba(244,245,238,0.72), rgba(214,220,207,0.7)); color: #40503c;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18); z-index: 100;
        }
        .audio-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(75, 68, 61, 0.14); }
        .audio-toggle.on {
            background: linear-gradient(135deg, #a5cd7a 0%, #7ea75d 40%, #5f7f4d 100%); color: #f7f3ea;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(63, 95, 63, 0.28);
        }
        .light-toggle {
            position: fixed; top: 84px; left: 26px; display: flex; align-items: center; gap: 9px; padding: 11px 16px;
            border: 2px solid rgba(80, 96, 74, 0.2); border-radius: 999px;
            background: linear-gradient(180deg, rgba(244,245,238,0.82), rgba(214,220,207,0.8));
            color: #40503c; font-size: 13px; font-weight: 800;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), 0 7px 16px rgba(56, 72, 51, 0.14); cursor: pointer; z-index: 100;
        }
        .light-toggle input { width: 15px; height: 15px; margin: 0; accent-color: #5a8555; cursor: pointer; }
        .loader-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 22px; background: linear-gradient(180deg, #dfeccd 0%, #c9d9ba 40%, #b4c9a5 100%);
            z-index: 1000; opacity: 1; transition: opacity 0.8s ease;
        }
        .loader-overlay.loader-hidden { opacity: 0; pointer-events: none; }
        .loader-spinner {
            width: 58px; height: 58px; border-radius: 50%; border: 5px solid rgba(90, 133, 85, 0.25);
            border-top-color: #5a8555; animation: loader-spin 0.9s linear infinite;
        }
        .loader-label { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #40503c; text-transform: uppercase; }
        @keyframes loader-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
        <div class="loader-label">Growing your terrarium…</div>
    </div>
    <button class="audio-toggle" id="audioToggle">Audio Off</button>
    <label class="light-toggle" for="lightShaftToggle">
        <input id="lightShaftToggle" type="checkbox" checked>
        <span>Sunbeams</span>
    </label>
    <div class="weather-controls">
        <button class="weather-btn active" data-weather="sunny">Sunny</button>
        <button class="weather-btn" data-weather="rainy">Rainy</button>
        <button class="weather-btn" data-weather="night">Night</button>
    </div>
    <div class="rain-control" id="rainControl" hidden>
        <label for="rainAmount">Rain</label>
        <input id="rainAmount" type="range" min="0" max="100" value="55" step="1" aria-label="Rain amount">
        <output id="rainAmountValue" for="rainAmount">55%</output>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- Loading manager + spinner overlay ----------------------------------
        const loadingManager = new THREE.LoadingManager();
        const loaderOverlay = document.getElementById('loaderOverlay');
        let loaderHidden = false;
        function hideLoader() {
            if (loaderHidden) return;
            loaderHidden = true;
            if (!loaderOverlay) return;
            loaderOverlay.classList.add('loader-hidden');
            loaderOverlay.addEventListener('transitionend', () => loaderOverlay.remove(), { once: true });
        }
        loadingManager.onLoad = hideLoader;
        loadingManager.onError = (url) => {
            console.warn('Asset failed to load:', url);
            hideLoader();
        };
        window.setTimeout(hideLoader, 8000);
        const gltfLoader = new GLTFLoader(loadingManager);
        const modelCache = new Map();

        function loadModelTemplate(fileName) {
            if (!modelCache.has(fileName)) {
                const modelUrl = new URL(`assets/${fileName}`, import.meta.url).href;
                modelCache.set(fileName, new Promise((resolve, reject) => {
                    gltfLoader.load(modelUrl, resolve, undefined, reject);
                }));
            }
            return modelCache.get(fileName);
        }

        function cloneFittedModel(gltf, targetSize, useSourceScene = false) {
            const sourceModel = useSourceScene ? gltf.scene : cloneSkeleton(gltf.scene);
            const sourceBounds = new THREE.Box3().setFromObject(sourceModel);
            const sourceSize = sourceBounds.getSize(new THREE.Vector3());
            const largestDimension = Math.max(sourceSize.x, sourceSize.y, sourceSize.z);
            if (largestDimension > 0) sourceModel.scale.multiplyScalar(targetSize / largestDimension);
            sourceModel.updateMatrixWorld(true);

            const fittedBounds = new THREE.Box3().setFromObject(sourceModel);
            const fittedCenter = fittedBounds.getCenter(new THREE.Vector3());
            sourceModel.position.set(-fittedCenter.x, -fittedBounds.min.y, -fittedCenter.z);
            const model = new THREE.Group();
            model.add(sourceModel);
            model.traverse((object) => {
                if (object.isMesh) {
                    object.castShadow = true;
                    object.receiveShadow = true;
                    object.frustumCulled = false;
                }
            });
            return model;
        }

        function replaceWithModel(fallback, fileName, targetHeight, position, onLoaded, useSourceScene = false) {
            loadModelTemplate(fileName).then((gltf) => {
                const model = cloneFittedModel(gltf, targetHeight, useSourceScene);
                model.position.add(position);
                scene.add(model);
                scene.remove(fallback);
                fallback.traverse((object) => {
                    if (object.isMesh && object.geometry) object.geometry.dispose();
                });
                if (onLoaded) onLoaded(model, gltf);
            }).catch((error) => {
                console.warn(`Could not load ${fileName}; keeping procedural fallback.`, error);
            });
        }

        async function loadModel(url, position = new THREE.Vector3(0, 0, 0), scale = 1) {
            const gltf = await gltfLoader.loadAsync(url);
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            if (typeof scale === 'number') model.scale.setScalar(scale);
            else model.scale.copy(scale);
            model.position.copy(position);
            scene.add(model);
            return model;
        }

        // --- World size -----------------------------------------------------------
        const SOIL_SIZE = 35.2;                 // was 17.6 (2x per side = 4x area)
        const SOIL_SCALE = SOIL_SIZE / 17.6;
        const SOIL_HALF = SOIL_SIZE / 2;
        const GLASS_W = 42, GLASS_H = 28;       // was a 24.8 cube
        const RAIN_AREA = SOIL_SIZE - 2;
        let frameCount = 0;

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = null;
        scene.fog = new THREE.FogExp2(0xcfe2c7, 0.0);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 40, 56);
        const overviewFov = camera.fov;
        let targetFov = overviewFov;
        const interiorEyeHeight = 5.3;
        let walkingDistance = 0;
        let headBob = 0;
        const focusTarget = new THREE.Vector3(0, 4, 0);

        const backdropThemes = {
            sunny: {
                sky: new THREE.Color(0x9fc8d8),
                horizon: new THREE.Color(0xe8b99b),
                glow: new THREE.Color(0xffdda9),
                glowPosition: new THREE.Vector2(0.72, 0.58),
            },
            rainy: {
                sky: new THREE.Color(0x536e78),
                horizon: new THREE.Color(0x91a49a),
                glow: new THREE.Color(0xbfc9bd),
                glowPosition: new THREE.Vector2(0.7, 0.5),
            },
            night: {
                sky: new THREE.Color(0x151a32),
                horizon: new THREE.Color(0x44516f),
                glow: new THREE.Color(0xe4d8b4),
                glowPosition: new THREE.Vector2(0.76, 0.72),
            },
        };
        const backdropTarget = {
            sky: backdropThemes.sunny.sky.clone(),
            horizon: backdropThemes.sunny.horizon.clone(),
            glow: backdropThemes.sunny.glow.clone(),
            glowPosition: backdropThemes.sunny.glowPosition.clone(),
        };
        const backdropUniforms = {
            uSkyColor: { value: backdropThemes.sunny.sky.clone() },
            uHorizonColor: { value: backdropThemes.sunny.horizon.clone() },
            uGlowColor: { value: backdropThemes.sunny.glow.clone() },
            uGlowPosition: { value: backdropThemes.sunny.glowPosition.clone() },
        };
        const backdropMaterial = new THREE.ShaderMaterial({
            uniforms: backdropUniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uSkyColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uGlowColor;
                uniform vec2 uGlowPosition;
                varying vec2 vUv;
                void main() {
                    float height = smoothstep(0.0, 1.0, vUv.y);
                    vec3 color = mix(uHorizonColor, uSkyColor, height);
                    vec2 glowOffset = (vUv - uGlowPosition) * vec2(1.0, 1.2);
                    float radialGlow = exp(-dot(glowOffset, glowOffset) * 20.0);
                    color = mix(color, uGlowColor, radialGlow * 0.78);
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            depthTest: false,
            depthWrite: false,
            toneMapped: false,
        });
        const backdropDistance = 80;
        const backdropPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), backdropMaterial);
        backdropPlane.position.set(0, 0, -backdropDistance);
        backdropPlane.renderOrder = -1000;
        backdropPlane.frustumCulled = false;

        function resizeBackdrop() {
            const height = 2 * backdropDistance * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
            backdropPlane.scale.set(height * camera.aspect, height, 1);
        }

        resizeBackdrop();
        camera.add(backdropPlane);
        scene.add(camera);

        function setBackdropTheme(weather) {
            const theme = backdropThemes[weather];
            backdropTarget.sky.copy(theme.sky);
            backdropTarget.horizon.copy(theme.horizon);
            backdropTarget.glow.copy(theme.glow);
            backdropTarget.glowPosition.copy(theme.glowPosition);
        }

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bokehPass = new BokehPass(scene, camera, {
            focus: camera.position.distanceTo(focusTarget),
            aperture: 0.0001,
            maxblur: 0.0005,
        });
        composer.addPass(bokehPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.8, 0.75);
        bloomPass.threshold = 0.75;
        bloomPass.strength = 0.45;
        bloomPass.radius = 0.55;
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 28;
        controls.maxDistance = 130;
        controls.target.set(0, 4, 0);
        const pointerControls = new PointerLockControls(camera, renderer.domElement);
        const explorationClock = new THREE.Clock();
        const movementKeys = new Set();
        const overviewCameraPosition = new THREE.Vector3();
        const overviewOrbitTarget = new THREE.Vector3();
        const walkDirection = new THREE.Vector3();
        const walkForward = new THREE.Vector3();
        const walkRight = new THREE.Vector3();
        const fallbackLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let explorationActive = false;
        let pointerLockUnavailable = false;
        let fallbackMouseLook = false;
        let fallbackMouseX = 0;
        let fallbackMouseY = 0;
        let focusDistance = bokehPass.uniforms.focus.value;
        const focusTargetView = new THREE.Vector3();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(10, 20, 8);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(4096, 4096);
        directionalLight.shadow.camera.left = -34;
        directionalLight.shadow.camera.right = 34;
        directionalLight.shadow.camera.top = 34;
        directionalLight.shadow.camera.bottom = -34;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 120;
        directionalLight.shadow.camera.updateProjectionMatrix();
        directionalLight.shadow.bias = -0.0002;
        directionalLight.shadow.normalBias = 0.025;
        directionalLight.shadow.radius = 3;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const hemisphereLight = new THREE.HemisphereLight(0xdff7ff, 0x214e2a, 0.7);
        scene.add(hemisphereLight);

        const glassEdgeLight = new THREE.PointLight(0xffffff, 2.8, 60, 2);
        glassEdgeLight.position.set(6, 9, 6);
        scene.add(glassEdgeLight);

        // Terrarium Case (Glass Cube)
        const glassGeometry = new THREE.BoxGeometry(GLASS_W, GLASS_H, GLASS_W);
        const glassCanvas = document.createElement('canvas');
        glassCanvas.width = 256;
        glassCanvas.height = 256;
        const glassCtx = glassCanvas.getContext('2d');

        function generateGlassNormalMap(t) {
            const image = glassCtx.createImageData(glassCanvas.width, glassCanvas.height);
            const data = image.data;
            const wave = currentWeather === 'rainy' ? 1 : 0.35;

            for (let y = 0; y < glassCanvas.height; y++) {
                for (let x = 0; x < glassCanvas.width; x++) {
                    const idx = (y * glassCanvas.width + x) * 4;
                    const nx = (x / glassCanvas.width) * 2 - 1;
                    const ny = (y / glassCanvas.height) * 2 - 1;
                    const noise = Math.sin((x * 0.18) + t * 1.6) * Math.cos((y * 0.14) - t * 1.3);
                    const droplets = Math.exp(-((nx * nx + ny * ny) * 32)) * wave * 0.9;
                    const height = noise * 0.5 + droplets + 0.25;

                    data[idx] = Math.min(255, Math.max(0, 128 + height * 60));
                    data[idx + 1] = Math.min(255, Math.max(0, 128 + height * 60));
                    data[idx + 2] = 255;
                    data[idx + 3] = 255;
                }
            }
            glassCtx.putImageData(image, 0, 0);
        }

        const glassNormalTexture = new THREE.CanvasTexture(glassCanvas);
        glassNormalTexture.wrapS = THREE.RepeatWrapping;
        glassNormalTexture.wrapT = THREE.RepeatWrapping;
        glassNormalTexture.anisotropy = 8;

        // Simple see-through glass (transmission made the inside too dark to see)
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xeaf6f0,
            metalness: 0,
            roughness: 0.05,
            transmission: 0,
            transparent: true,
            opacity: 0.10,
            depthWrite: false,
            ior: 1.5,
            clearcoat: 1,
            clearcoatRoughness: 0.04,
            normalMap: glassNormalTexture,
            normalScale: new THREE.Vector2(0.02, 0.02),
            side: THREE.DoubleSide,
        });
        const glassCube = new THREE.Mesh(glassGeometry, glassMaterial);
        glassCube.position.y = GLASS_H / 2 - 0.4;
        glassCube.castShadow = false;
        glassCube.receiveShadow = false;
        scene.add(glassCube);

        const glassFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(glassGeometry),
            new THREE.LineBasicMaterial({ color: 0xd8eee5, transparent: true, opacity: 0.6, depthWrite: false })
        );
        glassFrame.position.copy(glassCube.position);
        glassFrame.visible = true;
        scene.add(glassFrame);

        const godRayNoiseCanvas = document.createElement('canvas');
        godRayNoiseCanvas.width = 128;
        godRayNoiseCanvas.height = 256;
        const godRayNoiseContext = godRayNoiseCanvas.getContext('2d');
        const godRayNoiseImage = godRayNoiseContext.createImageData(128, 256);
        for (let i = 0; i < godRayNoiseImage.data.length; i += 4) {
            const value = Math.floor(Math.random() * 256);
            godRayNoiseImage.data[i] = value;
            godRayNoiseImage.data[i + 1] = value;
            godRayNoiseImage.data[i + 2] = value;
            godRayNoiseImage.data[i + 3] = 255;
        }
        godRayNoiseContext.putImageData(godRayNoiseImage, 0, 0);

        const godRayNoiseTexture = new THREE.CanvasTexture(godRayNoiseCanvas);
        godRayNoiseTexture.wrapS = THREE.RepeatWrapping;
        godRayNoiseTexture.wrapT = THREE.RepeatWrapping;

        const godRayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uNoise: { value: godRayNoiseTexture },
                uTime: { value: 0 },
                uIntensity: { value: 0 },
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D uNoise;
                uniform float uTime;
                uniform float uIntensity;
                varying vec2 vUv;
                void main() {
                    vec2 noiseUv = vec2(vUv.x * 2.0 + uTime * 0.006, vUv.y * 3.0 - uTime * 0.018);
                    float noise = texture2D(uNoise, noiseUv).r;
                    float shaftFade = smoothstep(0.0, 0.18, vUv.y) * (1.0 - smoothstep(0.76, 1.0, vUv.y));
                    float rayBands = smoothstep(0.32, 0.78, noise);
                    float alpha = (0.012 + rayBands * 0.09) * shaftFade * uIntensity;
                    gl_FragColor = vec4(1.0, 0.9, 0.62, alpha);
                }
            `,
            transparent: true,
            depthTest: false,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            toneMapped: false,
        });

        const godRaySource = directionalLight.position.clone();
        const godRayEnd = new THREE.Vector3(0, 1.2, 0);
        const godRayEntry = godRaySource.clone().lerp(godRayEnd, (godRaySource.y - 16) / (godRaySource.y - godRayEnd.y));
        const godRayDirection = godRayEntry.clone().sub(godRayEnd);
        const godRayGeometry = new THREE.ConeGeometry(2.6, godRayDirection.length(), 48, 1, true);
        const godRayMesh = new THREE.Mesh(godRayGeometry, godRayMaterial);
        godRayMesh.position.copy(godRayEntry).add(godRayEnd).multiplyScalar(0.5);
        godRayMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), godRayDirection.normalize());
        godRayMesh.renderOrder = 2;
        godRayMesh.frustumCulled = false;
        scene.add(godRayMesh);

        const renderBokehPass = bokehPass.render.bind(bokehPass);
        bokehPass.render = (...args) => {
            const glassWasVisible = glassCube.visible;
            const glassFrameWasVisible = glassFrame.visible;
            const godRaysWereVisible = godRayMesh.visible;
            glassCube.visible = false;
            glassFrame.visible = false;
            godRayMesh.visible = false;
            try {
                renderBokehPass(...args);

                glassCube.visible = glassWasVisible;

        };

        const glowRing = new THREE.Mesh(
            new THREE.TorusGeometry(GLASS_W / 2, 0.32, 22, 140),

        // Base (Soil/Dirt)
        const baseGeometry = new THREE.BoxGeometry(SOIL_SIZE, 3.6, SOIL_SIZE);

        // Procedural soil (used if the assets/soil textures are missing, which render black)
        const soilCanvas = document.createElement('canvas');
        soilCanvas.width = soilCanvas.height = 256;
        const sc = soilCanvas.getContext('2d');
        sc.fillStyle = '#7a5a3a';
        sc.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 5000; i++) {
            sc.fillStyle = `hsl(${22 + Math.random() * 10},${30 + Math.random() * 20}%,${25 + Math.random() * 30}%)`;
            const s = 1 + Math.random() * 3;

        }
        const soilFallbackMap = new THREE.CanvasTexture(soilCanvas);
        soilFallbackMap.wrapS = soilFallbackMap.wrapT = THREE.RepeatWrapping;

        const soilMaterial = new THREE.MeshStandardMaterial({

        const soilTextureLoader = new THREE.TextureLoader(loadingManager);
        function loadSoilTexture(fileName, colorSpace, apply) {
            soilTextureLoader.load(new URL(`assets/soil/${fileName}`, import.meta.url).href, (t) => {
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(14 * SOIL_SCALE, 14 * SOIL_SCALE);
                t.anisotropy = renderer.capabilities.getMaxAnisotropy();
                t.colorSpace = colorSpace;

        }
        loadSoilTexture('Ground112_2K-JPG_Color.jpg', THREE.SRGBColorSpace, (t) => { soilMaterial.map = t; });
        loadSoilTexture('Ground112_2K-JPG_NormalGL.jpg', THREE.NoColorSpace, (t) => { soilMaterial.normalMap = t; soilMaterial.normalScale.set(0.55, 0.55); });
        loadSoilTexture('Ground112_2K-JPG_Roughness.jpg', THREE.NoColorSpace, (t) => { soilMaterial.roughnessMap = t; });
        loadSoilTexture('Ground112_2K-JPG_AmbientOcclusion.jpg', THREE.NoColorSpace, (t) => { soilMaterial.aoMap = t; soilMaterial.aoMapIntensity = 0.65; });

        const base = new THREE.Mesh(baseGeometry, soilMaterial);

        const stand = new THREE.Mesh(

        stand.position.y = -0.8;

        stand.receiveShadow = true;
        scene.add(stand);

        const deskCanvas = document.createElement('canvas');
        deskCanvas.width = 512;
        deskCanvas.height = 512;
        const deskContext = deskCanvas.getContext('2d');
        const plankColors = ['#928d7d', '#9a9383', '#898a7e', '#958a7a'];
        for (let plank = 0; plank < 4; plank++) {
            const y = plank * 128;
            deskContext.fillStyle = plankColors[plank];
            deskContext.fillRect(0, y, 512, 128);
            deskContext.strokeStyle = 'rgba(34, 32, 27, 0.1)';
            deskContext.lineWidth = 2;
            deskContext.beginPath();
            deskContext.moveTo(0, y + 1);
            deskContext.lineTo(512, y + 1);
            deskContext.stroke();

            for (let grain = 0; grain < 16; grain++) {
                const grainY = y + Math.random() * 128;
                deskContext.strokeStyle = grain % 2 === 0 ? 'rgba(222, 207, 180, 0.04)' : 'rgba(35, 32, 27, 0.035)';
                deskContext.lineWidth = 1 + Math.random() * 2;
                deskContext.beginPath();
                deskContext.moveTo(0, grainY);
                deskContext.bezierCurveTo(150, grainY - 5, 330, grainY + 5, 512, grainY + (Math.random() - 0.5) * 8);
                deskContext.stroke();

        }

        const deskTexture = new THREE.CanvasTexture(deskCanvas);
        deskTexture.wrapS = THREE.RepeatWrapping;

        deskTexture.repeat.set(60, 60);

        const desk = new THREE.Mesh(

        desk.rotation.x = -Math.PI / 2;
        desk.position.y = -0.49;
        scene.add(desk);

        const soilSurfaceY = 3.84;
        const contactCanvas = document.createElement('canvas');
        contactCanvas.width = 128;
        contactCanvas.height = 128;
        const contactContext = contactCanvas.getContext('2d');
        const contactGradient = contactContext.createRadialGradient(64, 64, 2, 64, 64, 64);
        contactGradient.addColorStop(0, 'rgba(35, 24, 15, 0.42)');
        contactGradient.addColorStop(0.4, 'rgba(35, 24, 15, 0.2)');
        contactGradient.addColorStop(1, 'rgba(35, 24, 15, 0)');
        contactContext.fillStyle = contactGradient;

        const contactTexture = new THREE.CanvasTexture(contactCanvas);

        function addContactAO(x, z, size) {
            const contactAO = new THREE.Mesh(contactGeometry, contactMaterial);
            contactAO.rotation.x = -Math.PI / 2;
            contactAO.position.set(x, soilSurfaceY + 0.012, z);

        // Helper function to generate grass blades
        function createGrass(count) {
            const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x4a7c23, roughness: 0.8, metalness: 0 });
            const halfWidth = SOIL_HALF - 0.4;

            for (let i = 0; i < count; i++) {
                const height = 0.5 + Math.random() * 0.7;
                const grassGeometry = new THREE.CylinderGeometry(0.003, 0.06, height, 4, 6);
                grassGeometry.computeBoundingSphere();
                grassGeometry.boundingSphere.radius += height * 0.5;
                const grass = new THREE.Mesh(grassGeometry, grassMaterial);

                const x = (Math.random() - 0.5) * halfWidth * 2;
                const z = (Math.random() - 0.5) * halfWidth * 2;

                grass.position.set(x, soilSurfaceY + height / 2, z);
                grass.rotation.y = Math.random() * Math.PI * 2;
                grass.rotation.x = (Math.random() - 0.5) * 0.18;
                grass.rotation.z = (Math.random() - 0.5) * 0.18;

                grass.castShadow = true;
                grass.receiveShadow = true;
                scene.add(grass);
                addContactAO(x, z, 0.55 + Math.random() * 0.3);
                swayingGrass.push({
                    mesh: grass,
                    basePositions: grassGeometry.attributes.position.array.slice(),
                    height,
                    phase: Math.random() * Math.PI * 2,
                });
            }
        }

        // Helper function to create rocks
        function createRocks(count) {
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x8f8f8f, roughness: 0.9, metalness: 0.08 });
            const halfWidth = SOIL_HALF - 0.6;

            for (let i = 0; i < count; i++) {
                const size = 0.56 + Math.random() * 0.72;
                const rockGeometry = new THREE.DodecahedronGeometry(size, 0);
                const rock = new THREE.Mesh(rockGeometry, rockMaterial);

                let x;
                let z;
                do {
                    x = (Math.random() - 0.5) * halfWidth * 2;
                    z = (Math.random() - 0.5) * halfWidth * 2;
                } while (Math.hypot(x - 1.4, z - 1.4) < 4.8);

                rock.position.set(x, soilSurfaceY + size * 0.8, z);
                rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

                rock.scale.set(1.2, 0.8, 1.1);
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
                addContactAO(x, z, size * 2.2);
                replaceWithModel(
                    rock,
                    'rocks.glb',
                    size * 2,
                    new THREE.Vector3(x, soilSurfaceY, z),
                    (model) => {
                        model.rotation.y = rock.rotation.y;
                    }
                );
            }
        }

        // Terrain height (x, y are plane-local coords; world z = -y)
        function terrainHeight(x, y) {
            const sx = x / SOIL_SCALE, sy = y / SOIL_SCALE;
            const radial = Math.hypot(sx, sy);
            const hill = (cx, cy, d, h) => Math.exp(-((sx - cx) ** 2 + (sy - cy) ** 2) / d) * h;
            return Math.sin(sx * 1.15) * 0.36 + Math.cos(sy * 1.05) * 0.32
                + Math.max(0, 1 - radial / 9.6) * 0.72
                + hill(-3.5, 2.5, 12, 1.6) + hill(4.2, -3, 14, 1.4) + hill(-1, 4.5, 10, 1.2) + hill(5.5, -1, 16, 1)
                + hill(-5, -4, 18, 0.9) + hill(2, 5.5, 12, 1.1) + hill(-6, 1.5, 20, 0.8) + hill(6.5, 3, 14, 1);
        }

        function createTerrainMounds() {
            const terrainGeometry = new THREE.PlaneGeometry(SOIL_SIZE + 1.6, SOIL_SIZE + 1.6, 160, 160);
            terrainGeometry.setAttribute('uv2', terrainGeometry.attributes.uv.clone());
            const positions = terrainGeometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                positions.setZ(i, terrainHeight(positions.getX(i), positions.getY(i)));
            }
            terrainGeometry.computeVertexNormals();

            const terrain = new THREE.Mesh(terrainGeometry, soilMaterial);
            terrain.rotation.x = -Math.PI / 2;
            terrain.position.y = 3.0;
            terrain.castShadow = true;
            terrain.receiveShadow = true;
            scene.add(terrain);

            const topLayerGeometry = new THREE.PlaneGeometry(SOIL_SIZE - 0.8, SOIL_SIZE - 0.8, 80, 80);
            topLayerGeometry.setAttribute('uv2', topLayerGeometry.attributes.uv.clone());
            const topLayer = new THREE.Mesh(topLayerGeometry, soilMaterial);
            topLayer.rotation.x = -Math.PI / 2;
            topLayer.position.y = 3.84;
            topLayer.castShadow = true;
            topLayer.receiveShadow = true;
            scene.add(topLayer);
        }

        // Helper function to create glowing mushrooms
        function createGlowingMushrooms(count) {
            const mushroomMaterial = new THREE.MeshStandardMaterial({
                color: 0xff66ff, emissive: 0xff66ff, emissiveIntensity: 0.8, roughness: 0.5, metalness: 0.2,
            });
            const stemMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8, metalness: 0 });
            const halfWidth = SOIL_HALF - 0.8;

            for (let i = 0; i < count; i++) {
                const stemHeight = 0.64 + Math.random() * 0.6;
                const stemRadius = 0.11 + Math.random() * 0.08;
                const capRadius = 0.28 + Math.random() * 0.16;

                const stemGeometry = new THREE.CylinderGeometry(stemRadius * 0.75, stemRadius, stemHeight, 8, 4);
                const stem = new THREE.Mesh(stemGeometry, stemMaterial);

                const capGeometry = new THREE.SphereGeometry(capRadius, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2);
                const cap = new THREE.Mesh(capGeometry, mushroomMaterial);

                let x;
                let z;
                do {
                    x = (Math.random() - 0.5) * halfWidth * 2;
                    z = (Math.random() - 0.5) * halfWidth * 2;
                } while (Math.hypot(x - 1.4, z - 1.4) < 4.8);

                stem.position.y = stemHeight / 2;
                cap.position.y = stemHeight;

                cap.rotation.x = Math.random() * 0.3 - 0.15;
                cap.rotation.z = Math.random() * 0.3 - 0.15;

                stem.castShadow = true;
                stem.receiveShadow = true;
                cap.castShadow = true;
                cap.receiveShadow = true;

                const plant = new THREE.Group();
                plant.position.set(x, soilSurfaceY, z);
                plant.add(stem, cap);
                scene.add(plant);
                addContactAO(x, z, capRadius * 3.2);
                glowingMushrooms.push(stem, cap);
                const swayEntry = { plant, phase: Math.random() * Math.PI * 2 };
                swayingMushrooms.push(swayEntry);
                replaceWithModel(
                    plant,
                    'mushroom.glb',
                    stemHeight * 1.55,
                    new THREE.Vector3(x, soilSurfaceY, z),
                    (model) => {
                        model.rotation.y = Math.random() * Math.PI * 2;
                        model.traverse((object) => {
                            if (object.isMesh && object.material && object.material.emissive) {
                                object.material.emissive.setHex(0x24102c);
                                object.material.emissiveIntensity = 0.16;
                            }
                        });
                        swayEntry.plant = model;
                    }
                );
            }
        }

        function createFern(x, z) {
            const fern = new THREE.Group();
            fern.position.set(x, soilSurfaceY, z);
            const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x527c3c, roughness: 0.86 });
            const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x6f9b4d, roughness: 0.78, side: THREE.DoubleSide });
            const leafGeometry = new THREE.SphereGeometry(1, 8, 6);

            for (let frondIndex = 0; frondIndex < 6; frondIndex++) {
                const frond = new THREE.Group();
                frond.rotation.y = (frondIndex / 6) * Math.PI * 2;
                frond.rotation.z = -0.22;
                fern.add(frond);

                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, 0.02, 0),
                    new THREE.Vector3(0.015, 0.28, 0),
                    new THREE.Vector3(0, 0.62, 0),
                ]);
                const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.009, 5, false), stemMaterial);
                stem.castShadow = true;
                frond.add(stem);

                for (let leafletIndex = 0; leafletIndex < 6; leafletIndex++) {
                    const height = 0.13 + leafletIndex * 0.083;
                    for (const side of [-1, 1]) {
                        const leaflet = new THREE.Mesh(leafGeometry, leafMaterial);
                        leaflet.position.set(side * (0.055 + leafletIndex * 0.012), height, 0);
                        leaflet.rotation.z = side * 0.62;
                        leaflet.scale.set(0.052, 0.12, 0.022);
                        leaflet.castShadow = true;
                        frond.add(leaflet);
                    }
                }
            }

            scene.add(fern);
            addContactAO(x, z, 0.58);
            const swayEntry = { plant: fern, phase: Math.random() * Math.PI * 2 };
            swayingFerns.push(swayEntry);
            replaceWithModel(fern, 'fern.glb', 1.8, new THREE.Vector3(x, soilSurfaceY, z), (model) => {
                swayEntry.plant = model;
            });
        }

        function createFrog(x, z) {
            const frogGroup = new THREE.Group();
            frogGroup.position.set(x, soilSurfaceY, z);

            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0x68a44d, roughness: 0.68 });
            const darkSkinMaterial = new THREE.MeshStandardMaterial({ color: 0x3f713d, roughness: 0.78 });
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xf6f0d9, roughness: 0.35 });
            const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x18251b, roughness: 0.28 });
            const sphereGeometry = new THREE.SphereGeometry(1, 18, 14);

            function addPart(material, position, scale) {
                const part = new THREE.Mesh(sphereGeometry, material);
                part.position.set(position.x, position.y, position.z);
                part.scale.set(scale.x, scale.y, scale.z);
                part.castShadow = true;
                part.receiveShadow = true;
                frogGroup.add(part);
                return part;
            }

            const body = addPart(skinMaterial, { x: 0, y: 0.24, z: 0 }, { x: 0.38, y: 0.25, z: 0.49 });
            addPart(skinMaterial, { x: 0, y: 0.43, z: 0.34 }, { x: 0.3, y: 0.24, z: 0.29 });

            for (const side of [-1, 1]) {
                addPart(skinMaterial, { x: side * 0.2, y: 0.62, z: 0.48 }, { x: 0.105, y: 0.13, z: 0.105 });
                addPart(eyeMaterial, { x: side * 0.2, y: 0.63, z: 0.565 }, { x: 0.073, y: 0.083, z: 0.06 });
                addPart(pupilMaterial, { x: side * 0.2, y: 0.63, z: 0.616 }, { x: 0.036, y: 0.047, z: 0.026 });
                addPart(darkSkinMaterial, { x: side * 0.075, y: 0.54, z: 0.603 }, { x: 0.018, y: 0.014, z: 0.012 });
                addPart(skinMaterial, { x: side * 0.28, y: 0.13, z: 0.29 }, { x: 0.11, y: 0.1, z: 0.2 });
                addPart(skinMaterial, { x: side * 0.3, y: 0.13, z: -0.24 }, { x: 0.17, y: 0.12, z: 0.23 });
                for (let toeIndex = 0; toeIndex < 3; toeIndex++) {
                    addPart(skinMaterial, {
                        x: side * (0.3 + (toeIndex - 1) * 0.065),
                        y: 0.065,
                        z: 0.45,
                    }, { x: 0.045, y: 0.04, z: 0.1 });
                }
            }

            for (let spotIndex = 0; spotIndex < 4; spotIndex++) {
                addPart(darkSkinMaterial, {
                    x: (spotIndex % 2 === 0 ? -1 : 1) * 0.18,
                    y: 0.43,
                    z: -0.18 + Math.floor(spotIndex / 2) * 0.2,
                }, { x: 0.055, y: 0.025, z: 0.07 });
            }

            frogGroup.userData.body = body;
            frogGroup.userData.breathPhase = Math.random() * Math.PI * 2;
            scene.add(frogGroup);
            addContactAO(x, z, 0.9);
            replaceWithModel(frogGroup, 'tree-frog.glb', 1.55, new THREE.Vector3(x, soilSurfaceY, z), (model, gltf) => {
                frog = model;
                model.rotation.y = 0;
                model.traverse((object) => {
                    if (!object.isMesh) return;
                    for (const material of Array.isArray(object.material) ? object.material : [object.material]) {
                        if (!material) continue;
                        material.metalness = 0;
                        material.roughness = 0.72;
                    }
                });
                if (gltf.animations.length > 0) {
                    frogMixer = new THREE.AnimationMixer(model);
                    const idleAnimation = gltf.animations.find((clip) => clip.name.toLowerCase().includes('idle')) || gltf.animations[0];
                    frogMixer.clipAction(idleAnimation).play();
                }
            });
            return frogGroup;
        }

        // Weather system
        let currentWeather = 'sunny';
        const fogThemes = {
            sunny: { outdoorColor: 0xbdd1b3, interiorColor: 0xf0c4a6, outdoorDensity: 0.0 },
            rainy: { outdoorColor: 0x91a893, interiorColor: 0xa9b9b0, outdoorDensity: 0.015 },

        const fogColorTarget = new THREE.Color(fogThemes.sunny.outdoorColor);

        // --- Bugs & animals --------------------------------------------------------
        function groundY(x, z) { return Math.max(soilSurfaceY, 3.0 + terrainHeight(x, -z)); }
        const critters = [];
        const rnd = (a, b) => a + Math.random() * (b - a);
        const cMat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.65, ...extra });
        const ball = new THREE.SphereGeometry(1, 10, 8);
        function part(group, material, [x, y, z], [sx, sy, sz]) {
            const m = new THREE.Mesh(ball, material);
            m.position.set(x, y, z);
            m.scale.set(sx, sy, sz);
            m.castShadow = true;
            group.add(m);
            return m;
        }
        function makeLadybug() {
            const g = new THREE.Group(), red = cMat(0xd62828), black = cMat(0x111111);
            part(g, red, [0, 0.1, 0], [0.17, 0.11, 0.21]);
            part(g, black, [0, 0.09, 0.19], [0.09, 0.07, 0.07]);
            for (const s of [-1, 1]) for (const z of [-0.06, 0.07]) part(g, black, [s * 0.08, 0.19, z], [0.03, 0.02, 0.03]);
            return g;
        }
        function makeBeetle() {
            const g = new THREE.Group(), shell = cMat(0x1f6f5c, { metalness: 0.6, roughness: 0.3 }), dark = cMat(0x14211c);
            part(g, shell, [0, 0.12, 0], [0.15, 0.11, 0.3]);
            part(g, dark, [0, 0.1, 0.3], [0.09, 0.07, 0.09]);
            for (const s of [-1, 1]) for (const z of [-0.12, 0, 0.12]) part(g, dark, [s * 0.17, 0.04, z], [0.07, 0.02, 0.02]);
            return g;
        }
        function makeSnail() {
            const g = new THREE.Group(), body = cMat(0xd9c7a0);
            part(g, body, [0, 0.07, 0], [0.13, 0.07, 0.38]);
            part(g, body, [0, 0.16, 0.34], [0.09, 0.1, 0.09]);
            part(g, cMat(0x8a5a2b), [0, 0.27, -0.08], [0.2, 0.22, 0.2]);
            for (const s of [-1, 1]) part(g, body, [s * 0.04, 0.32, 0.4], [0.015, 0.1, 0.015]);
            return g;
        }
        const spikeGeo = new THREE.ConeGeometry(0.035, 0.2, 5);
        function makeHedgehog() {
            const g = new THREE.Group(), spike = cMat(0x3b2a1b);
            part(g, spike, [0, 0.38, -0.05], [0.4, 0.33, 0.55]);
            part(g, cMat(0xd8b894), [0, 0.22, 0.5], [0.17, 0.17, 0.25]);
            part(g, cMat(0x111111), [0, 0.24, 0.74], [0.04, 0.04, 0.04]);
            const up = new THREE.Vector3(0, 1, 0);

        function updateCritters(dt) {
            const limit = SOIL_HALF - 1.2;
            for (const c of critters) {
                const g = c.g, p = g.position;
                c.t += dt;
                if (Math.abs(p.x) > limit || Math.abs(p.z) > limit) c.heading = Math.atan2(-p.x, -p.z) + rnd(-0.5, 0.5);
                let moving = true;
                if (c.kind === 'hop') {
                    if (c.wait > 0) { c.wait -= dt; moving = false; }
                    else {
                        c.hop += dt / 0.55;
                        if (c.hop >= 1) { c.hop = 0; c.wait = rnd(0.8, 4); c.heading += rnd(-1.2, 1.2); }
                    }
                } else {
                    c.heading += Math.sin(c.t * 0.6 + c.seed) * dt * (c.kind === 'fly' ? 1.4 : 0.9);
                }
                if (moving) {
                    p.x += Math.sin(c.heading) * c.speed * dt;
                    p.z += Math.cos(c.heading) * c.speed * dt;
                }
                const gy = groundY(p.x, p.z);
                p.y = c.kind === 'fly' ? gy + c.alt + Math.sin(c.t * 1.2 + c.seed) * 1.2
                    : c.kind === 'hop' ? gy + Math.sin(c.hop * Math.PI) * 0.9 : gy;
                g.rotation.y = c.heading;
                const wings = g.userData.wings;
                if (wings) for (const w of wings) {
                    w.pivot.rotation.z = g.userData.fast
                        ? w.s * Math.sin(c.t * 45) * 0.35
                        : w.s * (0.2 + Math.abs(Math.sin(c.t * 16 + c.seed)) * 0.9);
                }
            }
        }

        function updatePlantSway(now) {
            const rainy = currentWeather === 'rainy';

            for (const blade of swayingGrass) {
                const positions = blade.mesh.geometry.attributes.position;
                const amplitude = blade.height * (rainy ? 0.48 : 0.27);
                const swayX = Math.sin(now * 1.35 + blade.phase) * amplitude;
                const swayZ = Math.cos(now * 1.05 + blade.phase) * amplitude * 0.4;

                for (let i = 0; i < positions.count; i++) {
                    const baseY = blade.basePositions[i * 3 + 1];
                    const normalizedHeight = Math.max(0, (baseY + blade.height / 2) / blade.height);
                    const bend = normalizedHeight * normalizedHeight;
                    positions.setXYZ(
                        i,
                        blade.basePositions[i * 3] + swayX * bend,
                        baseY,
                        blade.basePositions[i * 3 + 2] + swayZ * bend
                    );
                }

                positions.needsUpdate = true;
                blade.mesh.geometry.computeVertexNormals();
            }

            const mushroomSway = rainy ? 0.12 : 0.055;
            for (const mushroom of swayingMushrooms) {
                mushroom.plant.rotation.z = Math.sin(now * 1.05 + mushroom.phase) * mushroomSway;
                mushroom.plant.rotation.x = Math.cos(now * 0.85 + mushroom.phase) * mushroomSway * 0.55;
            }

            for (const fern of swayingFerns) {
                fern.plant.rotation.z = Math.sin(now * 0.72 + fern.phase) * (rainy ? 0.08 : 0.035);
                fern.plant.rotation.x = Math.cos(now * 0.58 + fern.phase) * (rainy ? 0.04 : 0.018);
            }

            if (frog) {
                if (frog.userData.body) {
                    frog.userData.body.scale.y = 0.25 + Math.sin(now * 1.7 + frog.userData.breathPhase) * 0.009;
                }
            }
        }

        function initAudioContext() {
            if (!audioContext) {

        function playGlassTap() {
            if (!audioEnabled) return;
            initAudioContext();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(2000, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.15);
        }

        function createRainSound() {
            stopAmbientSound();
            if (!audioEnabled) return;
            initAudioContext();

            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioContext.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const highpass = audioContext.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 140;

            const lowpass = audioContext.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 2400;

            const gain = audioContext.createGain();
            gain.gain.value = 0.035;

            const lfo = audioContext.createOscillator();
            lfo.frequency.value = 0.12;
            const lfoGain = audioContext.createGain();
            lfoGain.gain.value = 0.009;
            lfo.connect(lfoGain);
            lfoGain.connect(gain.gain);

            whiteNoise.connect(highpass);
            highpass.connect(lowpass);
            lowpass.connect(gain);
            gain.connect(audioContext.destination);

            whiteNoise.start();
            lfo.start();
            ambientSource = whiteNoise;
            ambientGain = gain;
            ambientLFO = lfo;
        }

        function scheduleBirdCalls() {
            if (!audioEnabled || currentWeather !== 'sunny') return;

            const noteCount = 2 + Math.floor(Math.random() * 3);
            let noteOffset = 0;

            for (let i = 0; i < noteCount; i++) {
                const oscillator = audioContext.createOscillator();
                const envelope = audioContext.createGain();
                const start = audioContext.currentTime + noteOffset;
                const startFrequency = 2100 + Math.random() * 900;
                const endFrequency = startFrequency + (Math.random() - 0.35) * 900;

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(startFrequency, start);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(1200, endFrequency), start + 0.09);
                oscillator.frequency.exponentialRampToValueAtTime(startFrequency * 0.92, start + 0.19);
                envelope.gain.setValueAtTime(0.0001, start);
                envelope.gain.exponentialRampToValueAtTime(0.005, start + 0.025);
                envelope.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);

                oscillator.connect(envelope);
                envelope.connect(audioContext.destination);
                oscillator.start(start);
                oscillator.stop(start + 0.21);
                noteOffset += 0.12 + Math.random() * 0.08;
            }

            birdCallTimer = window.setTimeout(scheduleBirdCalls, 7000 + Math.random() * 11000);
        }

            const positions = splashSystem.geometry.attributes.position.array;
            const velocities = splashSystem.geometry.userData.velocities;
            const lifetimes = splashSystem.geometry.userData.lifetimes;

            for (let i = 0; i < lifetimes.length; i++) {
                if (lifetimes[i] <= 0) {
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = soilSurfaceY + 0.015;
                    positions[i * 3 + 2] = z;
                    velocities[i] = {
                        x: (Math.random() - 0.5) * 0.025,
                        y: Math.random() * 0.045 + 0.015,
                        z: (Math.random() - 0.5) * 0.025
                    };
                    lifetimes[i] = 0.4;
                    break;
                }
            }
        }

        function createFirefly() {
            const fireflyGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const fireflyMaterial = new THREE.MeshBasicMaterial({ color: 0xffff66 });
            firefly = new THREE.Mesh(fireflyGeometry, fireflyMaterial);
            firefly.position.set(0, 2, 0);
            scene.add(firefly);

            fireflyLight = new THREE.PointLight(0xffff66, 2.0, 3);
            fireflyLight.position.copy(firefly.position);
            scene.add(fireflyLight);
        }

        function updateGodRayTarget() {
            if (!godRayEnabled || currentWeather === 'night') {
                godRayTargetIntensity = 0;
            } else {
                godRayTargetIntensity = currentWeather === 'sunny' ? 1 : 0.16;
            }
        }

        function updateAtmosphericFog() {
            const theme = fogThemes[currentWeather];
            fogColorTarget.setHex(explorationActive ? theme.interiorColor : theme.outdoorColor);
            fogDensityTarget = explorationActive ? 0.62 : theme.outdoorDensity;
        }

        function setSunny() {
            currentWeather = 'sunny';
            updateGodRayTarget();
            rainControl.hidden = true;
            renderer.toneMappingExposure = 0.95;
            setBackdropTheme('sunny');
            updateAtmosphericFog();
            ambientLight.color.setHex(0xf7e7c8);
            ambientLight.intensity = 0.58;
            directionalLight.color.setHex(0xfff3d5);
            directionalLight.intensity = 0.78;
            fillLight.color.setHex(0xe5d7ae);
            fillLight.intensity = 0.34;
            hemisphereLight.intensity = 0.48;
            glassEdgeLight.intensity = 1.8;

            if (rainSystem) { scene.remove(rainSystem); rainSystem = null; }
            if (splashSystem) { scene.remove(splashSystem); splashSystem = null; }
            if (rippleSystem) { scene.remove(rippleSystem); rippleSystem = null; }
            if (firefly) { scene.remove(firefly); firefly = null; }
            if (fireflyLight) { scene.remove(fireflyLight); fireflyLight = null; }
            fireflyStartled = false;
            fireflyStartledTime = 0;
            createWindSound();
        }

        function setRainy() {
            currentWeather = 'rainy';
            updateGodRayTarget();
            rainControl.hidden = false;
            renderer.toneMappingExposure = 0.88;
            setBackdropTheme('rainy');
            updateAtmosphericFog();
            ambientLight.color.setHex(0xc5cbb5);
            ambientLight.intensity = 0.46;
            directionalLight.color.setHex(0xe0e8d8);
            directionalLight.intensity = 0.5;
            fillLight.color.setHex(0xb0bca9);
            fillLight.intensity = 0.24;
            hemisphereLight.intensity = 0.32;
            glassEdgeLight.intensity = 2.3;

            if (!rainSystem) createRain();
            if (rippleSystem) { scene.remove(rippleSystem); rippleSystem = null; }
            if (firefly) { scene.remove(firefly); firefly = null; }
            if (fireflyLight) { scene.remove(fireflyLight); fireflyLight = null; }
            fireflyStartled = false;
            fireflyStartledTime = 0;
            createRainSound();
        }

        function setNight() {
            currentWeather = 'night';
            updateGodRayTarget();
            rainControl.hidden = true;
            renderer.toneMappingExposure = 1.2;
            setBackdropTheme('night');
            updateAtmosphericFog();
            ambientLight.color.setHex(0x7a8e8a);
            ambientLight.intensity = 0.35;
            directionalLight.color.setHex(0x8ea39d);
            directionalLight.intensity = 0.44;
            fillLight.color.setHex(0x5c756d);
            fillLight.intensity = 0.18;
            hemisphereLight.intensity = 0.25;
            glassEdgeLight.intensity = 4.2;

            if (rainSystem) { scene.remove(rainSystem); rainSystem = null; }
            if (splashSystem) { scene.remove(splashSystem); splashSystem = null; }
            if (rippleSystem) { scene.remove(rippleSystem); rippleSystem = null; }
            if (!firefly) createFirefly();
            fireflyStartled = false;
            fireflyStartledTime = 0;
            stopAmbientSound();
        }

        const rainControl = document.getElementById('rainControl');
        const rainAmountSlider = document.getElementById('rainAmount');
        const rainAmountValue = document.getElementById('rainAmountValue');

        rainAmountSlider.addEventListener('input', () => {
            rainIntensity = Number(rainAmountSlider.value) / 100;
            rainAmountValue.value = `${rainAmountSlider.value}%`;

            if (rainSystem) {
                const activeCount = Math.round(rainSystem.geometry.userData.velocities.length * rainIntensity);
                rainSystem.geometry.setDrawRange(0, activeCount * 2);
            }

            if (rainIntensity === 0 && splashSystem) {
                const positions = splashSystem.geometry.attributes.position.array;
                const lifetimes = splashSystem.geometry.userData.lifetimes;
                lifetimes.fill(0);
                for (let i = 0; i < lifetimes.length; i++) positions[i * 3 + 1] = -10;
                splashSystem.geometry.attributes.position.needsUpdate = true;
            }
        });

        const lightShaftToggle = document.getElementById('lightShaftToggle');
        lightShaftToggle.addEventListener('change', () => {
            godRayEnabled = lightShaftToggle.checked;
            updateGodRayTarget();
        });

        document.querySelectorAll('.weather-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const weather = btn.dataset.weather;
                if (weather === 'sunny') setSunny();
                else if (weather === 'rainy') setRainy();
                else if (weather === 'night') setNight();
            });
        });

        const audioToggle = document.getElementById('audioToggle');
        audioToggle.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            audioToggle.textContent = audioEnabled ? 'Audio On' : 'Audio Off';
            audioToggle.classList.toggle('on', audioEnabled);

            if (audioEnabled) {
                initAudioContext();
                if (currentWeather === 'sunny') createWindSound();
                else if (currentWeather === 'rainy') createRainSound();
            } else {
                stopAmbientSound();
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = Math.min(explorationClock.getDelta(), 0.05);
            time += 0.01;
            updatePlantSway(Date.now() * 0.001);
            updateCritters(deltaTime);
            if (frogMixer) frogMixer.update(deltaTime);

            if (frameCount++ % 3 === 0) {
                generateGlassNormalMap(time * 2.4);
                glassNormalTexture.needsUpdate = true;
            }
            backdropUniforms.uSkyColor.value.lerp(backdropTarget.sky, 0.025);
            backdropUniforms.uHorizonColor.value.lerp(backdropTarget.horizon, 0.025);
            backdropUniforms.uGlowColor.value.lerp(backdropTarget.glow, 0.025);
            backdropUniforms.uGlowPosition.value.lerp(backdropTarget.glowPosition, 0.025);
            scene.fog.color.lerp(fogColorTarget, 0.025);
            scene.fog.density += (fogDensityTarget - scene.fog.density) * 0.05;
            godRayMaterial.uniforms.uTime.value = Date.now() * 0.001;
            godRayIntensity += (godRayTargetIntensity - godRayIntensity) * 0.025;
            godRayMaterial.uniforms.uIntensity.value = godRayIntensity;
            glassMaterial.normalScale.set(
                currentWeather === 'rainy' ? 0.06 + Math.sin(time * 3) * 0.01 : 0.012,
                currentWeather === 'rainy' ? 0.07 + Math.cos(time * 2.5) * 0.01 : 0.012
            );

            // Update rain
            if (rainSystem) {
                const positions = rainSystem.geometry.attributes.position.array;
                const velocities = rainSystem.geometry.userData.velocities;
                const streakLengths = rainSystem.geometry.userData.streakLengths;
                const activeCount = Math.round(velocities.length * rainIntensity);

                for (let i = 0; i < activeCount; i++) {
                    const i6 = i * 6;
                    positions[i6 + 1] -= velocities[i];
                    positions[i6 + 4] -= velocities[i];

                    if (positions[i6 + 4] < soilSurfaceY + 0.02) {
                        const x = (Math.random() - 0.5) * RAIN_AREA;
                        const y = soilSurfaceY + 13 + Math.random() * 1.5;
                        const z = (Math.random() - 0.5) * RAIN_AREA;
                        spawnSplash(positions[i6], positions[i6 + 2]);
                        positions[i6] = x;
                        positions[i6 + 1] = y;
                        positions[i6 + 2] = z;
                        positions[i6 + 3] = x;
                        positions[i6 + 4] = y - streakLengths[i];
                        positions[i6 + 5] = z;
                    }
                }

                rainSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Update splash particles
            if (splashSystem) {
                const positions = splashSystem.geometry.attributes.position.array;
                const velocities = splashSystem.geometry.userData.velocities;
                const lifetimes = splashSystem.geometry.userData.lifetimes;

                for (let i = 0; i < lifetimes.length; i++) {
                    if (lifetimes[i] > 0) {
                        positions[i * 3] += velocities[i].x;
                        positions[i * 3 + 1] += velocities[i].y;
                        positions[i * 3 + 2] += velocities[i].z;
                        velocities[i].y -= 0.006;
                        lifetimes[i] -= 0.035;

                        if (lifetimes[i] <= 0) positions[i * 3 + 1] = -10;
                    }
                }

                splashSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Update ripple particles
            if (rippleSystem) {
                const positions = rippleSystem.geometry.attributes.position.array;
                const velocities = rippleSystem.geometry.userData.velocities;
                const lifetimes = rippleSystem.geometry.userData.lifetimes;

                for (let i = 0; i < lifetimes.length; i++) {
                    if (lifetimes[i] > 0) {
                        positions[i * 3] += velocities[i].x;
                        positions[i * 3 + 1] += velocities[i].y;
                        positions[i * 3 + 2] += velocities[i].z;
                        lifetimes[i] -= 0.03;

                        if (lifetimes[i] <= 0) positions[i * 3 + 1] = -10;
                    }
                }

                rippleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Update floating ambient dust / spores
            if (ambientParticles) {
                const positions = ambientParticles.geometry.attributes.position.array;

                for (let i = 0; i < ambientParticlesData.length; i++) {
                    const data = ambientParticlesData[i];
                    const i3 = i * 3;

                    data.angle += 0.003 + data.speed * 0.0008;
                    const driftX = Math.sin(time * data.speed + data.drift) * data.sway;
                    const driftZ = Math.cos(time * (data.speed * 0.9) + data.drift * 0.7) * data.sway;

                    positions[i3] = data.radius * Math.cos(data.angle) + driftX;
                    positions[i3 + 2] = data.radius * Math.sin(data.angle) + driftZ;
                    positions[i3 + 1] = data.baseY + Math.sin(time * 0.8 + data.drift) * 0.18 + 0.25;

                    if (positions[i3 + 1] > 4.6) positions[i3 + 1] = 1.0;
                }

                ambientParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Update firefly
            if (firefly) {
                if (fireflyStartled) {
                    fireflyStartledTime += 0.01;
                    if (fireflyStartledTime > 0.5) {
                        fireflyStartled = false;
                        fireflyStartledTime = 0;
                    }
                } else {
                    firefly.position.x = Math.sin(time) * 1.2;
                    firefly.position.z = Math.cos(time * 0.7) * 1.2;
                    firefly.position.y = 2 + Math.sin(time * 1.5) * 0.5;
                }
                fireflyLight.position.copy(firefly.position);
            }

            const fovDifference = targetFov - camera.fov;
            if (Math.abs(fovDifference) > 0.001) {
                camera.fov += fovDifference * Math.min(1, deltaTime * 5);
                camera.updateProjectionMatrix();
                resizeBackdrop();
            } else if (camera.fov !== targetFov) {
                camera.fov = targetFov;
                camera.updateProjectionMatrix();
                resizeBackdrop();
            }

            if (explorationActive) {
                const forwardInput = Number(movementKeys.has('KeyW') || movementKeys.has('ArrowUp')) - Number(movementKeys.has('KeyS') || movementKeys.has('ArrowDown'));
                const sideInput = Number(movementKeys.has('KeyD') || movementKeys.has('ArrowRight')) - Number(movementKeys.has('KeyA') || movementKeys.has('ArrowLeft'));
                walkForward.copy(pointerControls.getDirection(walkForward));
                walkForward.y = 0;
                walkForward.normalize();
                walkRight.crossVectors(walkForward, camera.up).normalize();
                walkDirection.set(0, 0, 0)
                    .addScaledVector(walkForward, forwardInput)
                    .addScaledVector(walkRight, sideInput);

                const isWalking = walkDirection.lengthSq() > 0;
                if (isWalking) {
                    const travel = 2.4 * deltaTime;
                    camera.position.addScaledVector(walkDirection.normalize(), travel);
                    walkingDistance += travel;
                    const interiorLimit = glassGeometry.parameters.width / 2 - 0.38;
                    camera.position.x = THREE.MathUtils.clamp(camera.position.x, -interiorLimit, interiorLimit);
                    camera.position.z = THREE.MathUtils.clamp(camera.position.z, -interiorLimit, interiorLimit);
                }

                const bobTarget = isWalking ? Math.sin(walkingDistance * (Math.PI * 2 / 1.2)) * 0.04 : 0;
                headBob += (bobTarget - headBob) * Math.min(1, deltaTime * 10);
                camera.position.y = interiorEyeHeight + headBob;
            } else {
                controls.update();
            }
            camera.updateMatrixWorld();
            const targetFocusDistance = -focusTargetView.copy(focusTarget).applyMatrix4(camera.matrixWorldInverse).z;
            focusDistance += (targetFocusDistance - focusDistance) * 0.08;
            bokehPass.uniforms.focus.value = focusDistance;
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            resizeBackdrop();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize weather
        setSunny();

        animate();
    </script>
</body>
</html>
